# configs/cdp/executor.yaml — quem grava o livro (escritor único de book/, data/, reports/ e
# artifacts/). Só um humano muda este arquivo, numa sessão de operador, seguindo
# docs/cdp/AUTOMACAO.md ("Troca de executor"): `uv run python -m cdp executor transferir ...`.
# O valor oficial é o deste arquivo em `main`; `cdp publicar` relê o de origin/main antes de
# cada push. A identidade de cada ambiente é explícita (variável CDP_EXECUTOR ou o arquivo
# ignorado `.cdp/local.yaml`), nunca adivinhada.
