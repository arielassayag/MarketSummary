<meta charset="utf-8">
<title>Painel CDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap">
<style>
/* Layout: faixa-título em anil-noite (o céu do sertão) → trilho de abas fixo → painéis em
   coluna única com grades que viram uma coluna no celular; tabelas densas rolam no próprio
   contêiner. Anil = interação e série do CDP; teal/couro = long/short; semântica à parte. */
:root {
  --bg: #f1f2f6;
  --surface: #ffffff;
  --surface-2: #e8eaf1;
  --surface-3: #f6f7fa;
  --ink: #161a2c;
  --ink-2: #434962;
  --muted: #646a83;
  --line: #d5d8e2;
  --grid: #e6e8ef;
  --accent: #3442a6;
  --accent-2: #283591;
  --accent-soft: #e1e4f6;
  --on-accent: #ffffff;
  --mast: #141833;
  --mast-2: #232a55;
  --mast-ink: #f1f2fb;
  --mast-muted: #aeb3d8;
  --long: #007587;
  --short: #b04a14;
  --shadow: #8e93a8;
  --div-pos: #2a78d6;
  --div-neg: #e34948;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #4a3aa7;
  --pos-ink: #1d6b3f;
  --neg-ink: #b3261e;
  --ok: #1d7a43; --ok-bg: #dff1e5;
  --warn: #835300; --warn-bg: #fbedc9; --warn-mark: #d99a14;
  --crit: #b3261e; --crit-bg: #fbe1de; --crit-mark: #d4443b;
  --info: #33548a; --info-bg: #e1e8f5;
  --na: #5b6077; --na-bg: #eceef3;
  --sim: #f6c83a; --sim-2: #e9b520; --sim-ink: #1d1700;
  --band: #d9efe1;
  --tip-shadow: rgba(20, 24, 51, 0.16);
  --font-display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gutter: clamp(16px, 3vw, 32px);
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1018; --surface: #161925; --surface-2: #1e2232; --surface-3: #1a1d2b;
    --ink: #e8eaf4; --ink-2: #bcc0d6; --muted: #8e93ab; --line: #2d3247; --grid: #232838;
    --accent: #7d89f2; --accent-2: #9aa4f6; --accent-soft: #252b52; --on-accent: #0e1018;
    --mast: #080a14; --mast-2: #1b2045; --mast-ink: #eef0fb; --mast-muted: #9ca2cc;
    --long: #1aa2b5; --short: #e2692e; --shadow: #8a8fa6;
    --div-pos: #3987e5; --div-neg: #e66767;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
    --pos-ink: #5fcf8f; --neg-ink: #ff8f86;
    --ok: #5fcf8f; --ok-bg: #15301f; --warn: #f2c25b; --warn-bg: #352a0f; --warn-mark: #e0a019;
    --crit: #ff8f86; --crit-bg: #3a1716; --crit-mark: #e5534b; --info: #9fb8e8; --info-bg: #1a2438;
    --na: #9095ab; --na-bg: #222636;
    --sim: #f6c83a; --sim-2: #d9a514; --sim-ink: #1d1700;
    --band: #1d4430; --tip-shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1018; --surface: #161925; --surface-2: #1e2232; --surface-3: #1a1d2b;
  --ink: #e8eaf4; --ink-2: #bcc0d6; --muted: #8e93ab; --line: #2d3247; --grid: #232838;
  --accent: #7d89f2; --accent-2: #9aa4f6; --accent-soft: #252b52; --on-accent: #0e1018;
  --mast: #080a14; --mast-2: #1b2045; --mast-ink: #eef0fb; --mast-muted: #9ca2cc;
  --long: #1aa2b5; --short: #e2692e; --shadow: #8a8fa6;
  --div-pos: #3987e5; --div-neg: #e66767;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
  --pos-ink: #5fcf8f; --neg-ink: #ff8f86;
  --ok: #5fcf8f; --ok-bg: #15301f; --warn: #f2c25b; --warn-bg: #352a0f; --warn-mark: #e0a019;
  --crit: #ff8f86; --crit-bg: #3a1716; --crit-mark: #e5534b; --info: #9fb8e8; --info-bg: #1a2438;
  --na: #9095ab; --na-bg: #222636;
  --sim: #f6c83a; --sim-2: #d9a514; --sim-ink: #1d1700;
  --band: #1d4430; --tip-shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14px/1.5 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { color: var(--accent-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button, input, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
small { font-size: 12px; }
.wrap { max-width: 1360px; margin-inline: auto; padding-inline: var(--gutter); }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.pos { color: var(--pos-ink); }
.neg { color: var(--neg-ink); }
.nowrap { white-space: nowrap; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- faixa-título ---------- */
.mast { background: var(--mast); color: var(--mast-ink); border-bottom: 1px solid var(--mast-2); }
.mast-in { display: grid; gap: 14px; padding-block: 22px 20px; }
.brand { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.brand-mark {
  font: 800 44px/0.86 var(--font-display); letter-spacing: -0.02em;
  font-variation-settings: "opsz" 96; color: var(--mast-ink);
  padding: 6px 10px 4px; border: 2px solid var(--mast-ink); border-radius: 3px;
}
.brand-txt { display: grid; gap: 2px; min-width: 0; }
.brand-name { font: 700 26px/1.05 var(--font-display); letter-spacing: -0.01em; }
.brand-sub { color: var(--mast-muted); font-size: 13px; }
.mast-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.mast .chip { background: var(--mast-2); color: var(--mast-ink); border-color: transparent; }
.mast .pill { border: 1px solid transparent; }
.mast-summary { font-size: 15.5px; line-height: 1.45; max-width: 92ch; }
.mast-summary b { font-weight: 600; }
.mast-asof { color: var(--mast-muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; }

.sim-band {
  background: repeating-linear-gradient(135deg, var(--sim) 0 14px, var(--sim-2) 14px 28px);
  color: var(--sim-ink);
}
.sim-in { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 10px; }
.sim-tag { font: 800 18px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
.sim-txt { font-weight: 500; font-size: 13.5px; }
.notice-band { background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
.notice-band .wrap { padding-block: 8px; }

/* ---------- abas ---------- */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.tabs-in { display: flex; align-items: stretch; gap: 8px; }
.tablist { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; flex: 1 1 auto; min-width: 0; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer; white-space: nowrap;
  padding: 12px 12px 10px; font-weight: 500; color: var(--ink-2);
  border-bottom: 3px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab:focus-visible { outline-offset: -3px; }
.tab-sim {
  align-self: center; flex: 0 0 auto; font: 800 11px/1 var(--font-display); letter-spacing: 0.08em;
  background: var(--sim); color: var(--sim-ink); padding: 5px 8px; border-radius: 3px;
}

/* ---------- painéis ---------- */
main.wrap { padding-block: 22px 56px; }
.panel { display: grid; gap: 30px; grid-template-columns: minmax(0, 1fr); }
.sec { display: grid; gap: 14px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.sec-h h2 { font: 700 22px/1.15 var(--font-display); letter-spacing: -0.01em; }
.sec-h .sub { color: var(--muted); font-size: 13px; }
h3 { font-size: 15px; font-weight: 600; }
h4 { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.block {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; grid-template-columns: minmax(0, 1fr);
}
.block-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.block-h .sub { color: var(--muted); font-size: 12.5px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; align-content: start; grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1080px) { .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .cols, .cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); }
}
.note { color: var(--muted); font-size: 12.5px; max-width: 90ch; }
.empty {
  border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; color: var(--ink-2);
  background: var(--surface-3); max-width: 90ch;
}
.lead { font-size: 14.5px; max-width: 90ch; }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; grid-template-columns: minmax(0, 1fr);
}
.tile-l { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tile-v { font-size: 24px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.tile-v small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.tile-v > .bars, .tile-v > .stack, .tile-v > .gauge-w { flex: 1 1 100%; width: 100%; font-size: 12.5px; font-weight: 400; letter-spacing: 0; }
/* KPIs dentro de um bloco: sem moldura própria (o bloco já é o objeto) */
.block .tile { border: 0; background: var(--surface-3); }
.block .alerts > li { background: none; border-bottom: 1px solid var(--grid); border-radius: 0; }
.block .alerts > li:last-child { border-bottom: 0; }
.tile-s { font-size: 12px; color: var(--muted); }
.trio { display: grid; gap: 2px; width: 100%; }
.trio > div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--grid); padding-bottom: 2px; }
.trio > div:last-child { border-bottom: 0; }
.trio b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; order: 2; }
.trio span { font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0; order: 1; }
.kpis.k8 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .kpis.k8 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis.k8 { grid-template-columns: minmax(0, 1fr); } }

/* ---------- pills / chips ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  line-height: 1.6; white-space: nowrap; background: var(--na-bg); color: var(--na);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.pill.plain::before { display: none; }
.k-ok { background: var(--ok-bg); color: var(--ok); }
.k-warn { background: var(--warn-bg); color: var(--warn); }
.k-crit { background: var(--crit-bg); color: var(--crit); }
.k-info { background: var(--info-bg); color: var(--info); }
.k-na { background: var(--na-bg); color: var(--na); }
.k-sim { background: var(--sim); color: var(--sim-ink); }
.k-accent { background: var(--accent-soft); color: var(--accent-2); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--surface); font-size: 12px; line-height: 1.6;
  white-space: nowrap; color: var(--ink-2);
}
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.side { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--on-accent); }
.side.L { background: var(--long); }
.side.S { background: var(--short); }
.stance { display: inline-block; min-width: 2.2em; text-align: center; padding: 0 4px; border-radius: 3px; font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); }
.stance.up { color: var(--long); border-color: var(--long); }
.stance.down { color: var(--short); border-color: var(--short); }
.sq { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 3px; }
.sq.HIGH { background: var(--crit-bg); color: var(--crit); }
.sq.MEDIUM { background: var(--warn-bg); color: var(--warn); }
.sq.LOW { background: var(--na-bg); color: var(--ink-2); }
.sq.NA { background: var(--na-bg); color: var(--na); }

/* ---------- listas de alerta / leitura ---------- */
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.alerts > li {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start;
  padding: 8px 10px; border-radius: 4px; background: var(--surface-3); border-left: 3px solid var(--line);
}
.alerts > li.t-crit { border-left-color: var(--crit-mark); }
.alerts > li.t-warn { border-left-color: var(--warn-mark); }
.alerts > li.t-info { border-left-color: var(--info); }
.alerts > li.t-ok { border-left-color: var(--ok); }
.alerts > li > .pill { margin-top: 1px; }
.alerts .list { margin-top: 4px; font-size: 12.5px; }
.reading { display: grid; gap: 6px; }
.reading h4 { margin-top: 6px; }

/* ---------- key/value ---------- */
.kv { display: grid; grid-template-columns: fit-content(42%) minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 520px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 0 0; } .kv dd { margin-bottom: 8px; } }

/* ---------- tabelas ---------- */
.scroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.scroll.tall { max-height: 560px; overflow-y: auto; }
@media (max-width: 640px) { .scroll.stackable.tall { max-height: none; overflow-y: visible; } }
.tbl { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.tbl th {
  text-align: left; font-weight: 600; color: var(--ink-2); background: var(--surface-2);
  padding: 7px 8px; white-space: nowrap; font-size: 11.5px; vertical-align: bottom;
  position: sticky; top: 0; z-index: 1;
}
.tbl td { padding: 6px 8px; border-top: 1px solid var(--grid); vertical-align: top; white-space: nowrap; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl tbody tr:hover > td { background: var(--surface-3); }
.tbl tr.st-crit > td:first-child { box-shadow: inset 3px 0 0 var(--crit-mark); }
.tbl tr.st-warn > td:first-child { box-shadow: inset 3px 0 0 var(--warn-mark); }
.tbl tr.st-info > td:first-child { box-shadow: inset 3px 0 0 var(--info); }
.tbl tr.sel > td, .tbl td.selcol { background: var(--accent-soft); }
.tbl .wrapcell { min-width: 240px; max-width: 560px; white-space: normal; }
.tbl .sticky { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.tbl th.sticky { z-index: 2; background: var(--surface-2); }
.tbl tbody tr:hover > td.sticky { background: var(--surface-3); }
.sortbtn { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.sortbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sortbtn .ar { color: var(--muted); font-size: 10px; }
.cellsub { display: block; color: var(--muted); font-size: 11px; }
.rowbtn { all: unset; cursor: pointer; color: var(--accent); font-size: 11px; padding: 0 4px; }
.rowbtn:focus-visible { outline: 2px solid var(--accent); }
tr.detail > td { background: var(--surface-3); padding: 14px; white-space: normal; }
tr.detail:hover > td { background: var(--surface-3); }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; white-space: normal; max-width: 1200px; }
.detail-in { position: sticky; left: 14px; max-width: 100%; }
.bars .gap-row { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; text-align: center; letter-spacing: 0.2em; line-height: 1; }
.na-txt { color: var(--muted); font-style: italic; }

/* ---------- barras HTML ---------- */
.bars { display: grid; grid-template-columns: minmax(70px, 34%) minmax(0, 1fr) max-content; gap: 5px 10px; align-items: center; font-size: 12.5px; }
.bl { overflow-wrap: anywhere; line-height: 1.25; }
.bl small { display: block; color: var(--muted); font-size: 11px; }
.bt { position: relative; height: 16px; }
.bars.div .bt::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.bars:not(.div) .bt::before { content: ""; position: absolute; left: 0; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.bf { position: absolute; top: 3px; height: 10px; border-radius: 0 3px 3px 0; min-width: 1px; }
.bf.n { border-radius: 3px 0 0 3px; }
.bref { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); }
.bv { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bv small { display: block; color: var(--muted); font-size: 11px; }
.bars-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--muted); }
.bars-legend i { display: inline-block; width: 2px; height: 10px; background: var(--ink-2); margin-right: 5px; vertical-align: -1px; }

/* utilização vs. limite */
.ubw { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.ub { position: relative; flex: 1 1 auto; height: 8px; background: var(--grid); border-radius: 4px; min-width: 70px; }
.ub-f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ink-2); }
.ub-m { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.ub-m.lim { width: 2px; background: var(--ink); }
.ub.t-ok .ub-f { background: var(--accent); }
.ub.t-near .ub-f { background: var(--warn-mark); }
.ub.t-warn .ub-f { background: var(--warn-mark); }
.ub.t-crit .ub-f { background: var(--crit-mark); }
.ub.t-info .ub-f { background: var(--info); }
.ub.t-na .ub-f { background: var(--na); }
.ubv { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: right; }
.ub-legend { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }

/* ====================================================================== carregamento */
/* Formas compactas do data.json publicado (sem perda; ver cdp.workflow.painel_publicacao):
   {"_colunas": {...}, "_n": N, "_faltam": {...}} = tabela em colunas ("a.b" = campo b do
   objeto a), {"_rep": {"v": [...], "n": [...]}} = coluna em corridas (valor v[k] repetido n[k]
   vezes) e {"_partes": [...]} = texto em partes. Desfeitas aqui, antes de qualquer uso. */
function unrep(c) {
  if (!c || typeof c !== "object" || Array.isArray(c) || !c._rep) return c || [];
  var v = c._rep.v || [], k = c._rep.n || [], out = [];
  for (var j = 0; j < v.length; j++) for (var t = 0; t < k[j]; t++) out.push(v[j]);
  return out;
}
function unpack(x) {
  if (Array.isArray(x)) { return x.map(unpack); }
  if (!x || typeof x !== "object") return x;
  var keys = Object.keys(x);
  if (keys.length === 1 && Array.isArray(x._partes)) return x._partes.join("");
  if (x._colunas && typeof x._colunas === "object" && typeof x._n === "number") {
    var n = x._n, miss = x._faltam || {}, rows = [], i;
    for (i = 0; i < n; i++) rows.push({});
    Object.keys(x._colunas).forEach(function (col) {
      var vals = unrep(x._colunas[col]), skip = {}, dot = col.indexOf(".");
      (miss[col] || []).forEach(function (j) { skip[j] = 1; });
      var a = dot > 0 ? col.slice(0, dot) : col, b = dot > 0 ? col.slice(dot + 1) : null;
      for (var r = 0; r < n; r++) {
        if (skip[r]) continue;
        var v = unpack(vals[r]);
        if (b === null) rows[r][a] = v;
        else {
          if (!rows[r][a] || typeof rows[r][a] !== "object" || Array.isArray(rows[r][a])) rows[r][a] = {};
          rows[r][a][b] = v;
        }
      }
    });
    return rows;
  }
  var out = {};
  keys.forEach(function (k) { out[k] = unpack(x[k]); });
  /* {"_igual": "<chave irmã>", ...}: o conteúdo da chave irmã com estes campos */
  keys.forEach(function (k) {
    var v = out[k], ref = v && typeof v === "object" && !Array.isArray(v) ? v._igual : null;
    var src = typeof ref === "string" ? out[ref] : null;
    if (!src || typeof src !== "object" || Array.isArray(src) || src._igual !== undefined) return;
    var cp = {};
    Object.keys(src).forEach(function (kk) { cp[kk] = src[kk]; });
    Object.keys(v).forEach(function (kk) { if (kk !== "_igual") cp[kk] = v[kk]; });
    out[k] = cp;
  });
  return out;
}
