# Congelamento dos modelos selecionados a partir do catálogo OpenRouter.
# Snapshot: data/raw/openrouter_models_snapshot_2026-08-27.json (2026-08-27).
# Recomando `lock-models` para regenerar/validar contra o catálogo do dia.

catalog_snapshot:
  timestamp: "2026-08-27"
  source: "https://openrouter.ai/api/v1/models"
  file: "data/raw/openrouter_models_snapshot_2026-08-27.json"
  n_models: 417

models:
  - friendly_name: OpenAI GPT-5.5
    exact_model_id: openai/gpt-5.5
    provider: openai
    role: candidate
    slot: openai_frontier
    input_price_usd_per_m: 5.0
    output_price_usd_per_m: 30.0
    context_length: 1050000
    supported_parameters: [structured_outputs, seed, temperature, top_p, max_tokens]
    rationale: >
      Modelo de fronteira mais recente da OpenAI sem sufixo preview/pro/batch no
      snapshot de 2026-08-27; suporta structured_outputs; preço e contexto publicados.

  - friendly_name: Claude Sonnet 5
    exact_model_id: anthropic/claude-sonnet-5
    provider: anthropic
    role: candidate
    slot: anthropic_frontier
    input_price_usd_per_m: 2.0
    output_price_usd_per_m: 10.0
    context_length: 1000000
    supported_parameters: [structured_outputs, temperature, top_p, max_tokens]
    rationale: >
      Modelo de fronteira da Anthropic sem preview no snapshot; structured_outputs
      suportado; escolhido no lugar do Opus 5 para manter o judge fora do conjunto
      de candidatos.

  - friendly_name: Gemini 3.7 Flash
    exact_model_id: google/gemini-3.7-flash
    provider: google
    role: candidate
    slot: google_frontier
    input_price_usd_per_m: 0.38
    output_price_usd_per_m: 1.88
    context_length: 1048576
    supported_parameters: [structured_outputs, seed, temperature, top_p, max_tokens]
    rationale: >
      Google mais recente e estável (sem preview) no snapshot. Limitação registrada:
      não havia variante Pro sem preview no catálogo; a alternativa Pro disponível era
      preview-only, violando o critério de preferência por versão estável.

  - friendly_name: DeepSeek V4 Pro
    exact_model_id: deepseek/deepseek-v4-pro
    provider: deepseek
    role: candidate
    slot: lowcost_openweight
    input_price_usd_per_m: 0.87
    output_price_usd_per_m: 1.74
    context_length: 1048576
    supported_parameters: [structured_outputs, seed, temperature, top_p, max_tokens]
    rationale: >
      Família open-weight forte de baixo custo com structured_outputs e sem
      variante gratuita no snapshot.

  - friendly_name: Kimi K2.6 (judge)
    exact_model_id: moonshotai/kimi-k2.6
    provider: moonshotai
    role: judge
    slot: judge
    input_price_usd_per_m: 0.95
    output_price_usd_per_m: 4.0
    context_length: 262144
    supported_parameters: [structured_outputs, temperature, top_p, max_tokens]
    rationale: >
      Avaliador forte FORA do conjunto de candidatos, escolhido por custo após o
      esgotamento do limite da chave (o plano original usava claude-opus-5; 60
      julgamentos dele foram descartados para manter UM judge único e consistente
      para toda a amostra). Não-variante-thinking, structured_outputs ok.
