# Pesquisas de score, limites estruturais e tolerâncias numéricas.

weights:
  factuality: 30
  materiality: 25
  causal_discipline: 20
  coverage: 15
  clarity: 10

hard_fail_cap: 49

word_range: [180, 220]
headline_max_chars: 90

limits:
  key_moves: [3, 6]
  drivers: [1, 3]
  watch_items: [0, 3]

# Tolerância absoluta por measure_kind ao reproduzir valores do pacote.
# Troca de sinal SEMPRE é falha (sign_flip_is_failure), independente da tolerância.
tolerances:
  return_pct: 0.05
  change_pct: 0.05
  change_bps: 1.0
  contribution_bps: 0.5
  level: 0.05
  absolute_value: 0.05

sign_flip_is_failure: true

# Categorias de critical_errors do judge que implicam hard_fail.
judge_hard_fail_categories:
  - fabricated_fact
  - fabricated_event
  - unsupported_causal_as_fact
  - return_as_contribution
  - sign_error_critical
  - value_error_critical
  - unit_error_critical
  - nonexistent_evidence_id
  - schema_invalid
  - central_contradiction
