/* Portal do CDP — identidade "Sertão em xilogravura" (guia: docs/cdp/marca/IDENTIDADE.md).
   O portal é impresso como a marca: tinta de xilogravura sobre papel de cal e uma única cor
   especial, o sol queimado, só em ornamento (estrela, régua, sol do rodapé, aba ativa). Quem
   trabalha é o anil das portas e janelas caiadas do sertão: links, foco, série do CDP, barras.
   Long = mandacaru (verde-azulado), short = barro/cobre; +/− e ok/alerta/excesso à parte.
   Claro = cal a pino (padrão); escuro = a matriz invertida, tinta de osso sobre carvão, que segue
   o sistema ou a escolha do leitor (data-theme) só na tela: impresso, o portal sai no papel claro.
   Cinzel (as capitulares de "ASSET MANAGEMENT") só em textos sem algarismos; Alegreya na
   narrativa; IBM Plex Sans na interface e nos números; Plex Mono em códigos e tickers.
   Os SVG dos ornamentos e as máscaras da marca ficam no fim do arquivo. */
:root {
  --bg: #f4efe5; --surface: #fffdf8; --surface-2: #efe8db; --surface-3: #f8f4ec;
  --ink: #1d1611; --ink-2: #4a3e33; --muted: #685a4b; --line: #d8ccb8; --grid: #e8e0d1;
  --accent: #2b4596; --accent-2: #1e3274; --accent-soft: #e4e8f5; --on-accent: #ffffff;
  --long: #0c6670; --short: #8f3417; --long-soft: #d9ecee; --short-soft: #f6e0d6; --shadow: #8b816f;
  --div-pos: #2b4fa8; --div-neg: #c0412f;
  --c1: #2b4fa8; --c2: #6a3c5e; --c3: #24876a; --c4: #7f6a12; --c5: #a24f93; --c6: #57514a;
  --pos-ink: #1c6b3d; --neg-ink: #b0281f;
  --ok: #1d6b3e; --ok-bg: #e0efe2; --warn: #7a4e00; --warn-bg: #f8ebcc; --warn-mark: #b07f0a;
  --crit: #ab261d; --crit-bg: #f9dfda; --crit-mark: #cc3f33; --info: #2b4596; --info-bg: #e4e8f5;
  --na: #685a4b; --na-bg: #eee7da;
  --sim: #f2c230; --sim-2: #e0aa14; --sim-ink: #1d1700;
  --band: #d8ebda; --tip-shadow: rgba(29, 22, 17, 0.16);
  /* marca e ornamento (nunca dado) */
  --tinta: #1d1611; --sol: #b9692f; --sol-ink: #8e4a16; --on-sol: #12100d; --filete: #1d1611; --renda: #b8a487;
  --ceu-1: #fcfaf5; --ceu-2: #f3e6d0; --ceu-brasa: rgba(236, 170, 96, 0.22); --ceu-risco: rgba(29, 22, 17, 0.2);
  --horizonte: #1d1611; --chao: #fffdf8; --chao-line: #1d1611; --mast-sep: #d3c4ab;
  --foot-bg: #1d1611; --sel-bg: #1d1611; --sel-ink: #fbf7ef;
  --grao: var(--grao-claro);
  --font-display: "Cinzel", "Trajan Pro", "Cormorant SC", "Times New Roman", Georgia, serif;
  --font-serif: "Alegreya", "Source Serif 4", "Iowan Old Style", Georgia, Cambria, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gutter: clamp(16px, 3vw, 36px);
  --r: 2px;
  color-scheme: light;
}

@media screen {

    --bg: #12100d; --surface: #1b1713; --surface-2: #25201a; --surface-3: #171410;

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
/* a tela fora da página (rolagem elástica do Mac e do iPhone) é o céu do topo do cabeçalho: puxar
   no topo não mostra uma faixa de tinta sobre a cal; o chão rachado fica só no rodapé */
html { -webkit-text-size-adjust: 100%; background-color: var(--ceu-1); }
body {
  margin: 0; background-color: var(--bg); background-image: var(--grao); color: var(--ink);
  font: 400 14px/1.5 var(--font-body); font-variant-numeric: tabular-nums;
}
::selection { background: var(--sol); color: var(--on-sol); }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { color: var(--accent-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
button, input, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: 0.9em; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
small { font-size: 12px; }
.wrap { max-width: 1320px; margin-inline: auto; padding-inline: var(--gutter); }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.pos { color: var(--pos-ink); }
.neg { color: var(--neg-ink); }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow {
  display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--sol-ink);
}
.eyebrow::before { content: ""; flex: none; width: 11px; height: 11px; }
/* a estrela de 8 pontas da régua da marca, sempre no sol (ornamento e "onde você está", nunca dado) */
.sec-h h2::before, .eyebrow::before, .md ul > li::before, .md hr, .tl-i::before, .tab[aria-selected="true"]::after,
.th-hl::before, .panel > .sec + .sec::after, .sim-tag::before, .sim-tag::after {
  background: var(--sol);
  -webkit-mask: var(--orn-estrela) center / contain no-repeat; mask: var(--orn-estrela) center / contain no-repeat;
}

/* ---------- cabeçalho: céu de goiva, a marca completa e o horizonte de xilogravura ---------- */
.mast {
  position: relative; isolation: isolate; color: var(--ink);
  background:
    radial-gradient(ellipse 72% 80% at 50% 100%, var(--ceu-brasa), transparent 72%),
    linear-gradient(180deg, var(--ceu-1) 0%, var(--ceu-2) 100%);
}
/* riscos de goiva no céu, mais densos perto do horizonte (as listras do sol da marca) */
.mast::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 12px; height: 56px; z-index: -1; pointer-events: none;
  background: var(--ceu-risco);
  -webkit-mask: var(--orn-ceu) 50% 100% / 1600px 56px repeat-x; mask: var(--orn-ceu) 50% 100% / 1600px 56px repeat-x;
}
/* chapada do Araripe, mandacaru e xique-xique: vinheta centrada na coluna; o chão segue liso até as bordas */
.mast::after {
  content: ""; display: block; height: 48px; margin-top: 8px; background: var(--horizonte);
  -webkit-mask: var(--orn-horizonte) 50% 100% / auto 100% no-repeat, linear-gradient(#000 0 0) 0 100% / 100% 18.75% no-repeat;
  mask: var(--orn-horizonte) 50% 100% / auto 100% no-repeat, linear-gradient(#000 0 0) 0 100% / 100% 18.75% no-repeat;
}
.mast-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 32px; padding-block: 26px 0; }
.brand { display: flex; align-items: center; gap: 28px; min-width: 0; }
/* a marca completa (com ASSET MANAGEMENT e a régua com estrela), pintada por duas máscaras do logo
   com os tokens do tema: tinta sobre papel no claro, osso sobre carvão no escuro, o sol nos dois.
   O "CDP" que o script escreve fica escondido; o nome acessível vem do aria-label (role="img"). */
.brand-mark {
  position: relative; display: block; flex: none; width: clamp(208px, 22vw, 312px); aspect-ratio: var(--marca-proporcao);
  font-size: 0; line-height: 0; color: transparent;
}
.brand-mark::before, .brand-mark::after {
  content: ""; position: absolute; inset: 0; background: var(--tinta);
  -webkit-mask: var(--marca-tinta) 50% 0 / 100% auto no-repeat; mask: var(--marca-tinta) 50% 0 / 100% auto no-repeat;
}
.brand-mark::after { background: var(--sol); -webkit-mask-image: var(--marca-sol); mask-image: var(--marca-sol); }
.brand-txt { display: grid; gap: 8px; min-width: 0; padding-left: 28px; border-left: 1px solid var(--mast-sep); }
.brand-name { font: 600 31px/1.05 var(--font-display); letter-spacing: 0.05em; color: var(--ink); }
.brand-sub { color: var(--ink-2); font-size: 13.5px; max-width: 46ch; }
/* coluna da direita: base de 300 px para a quebra de linha do cabeçalho (o texto dela quebra por
   dentro, alinhado à direita); assim ela nunca desce sozinha para baixo da marca acima de 1.120 px,
   qualquer que seja o tamanho da data e dos selos */
.mast-side { flex: 1 1 300px; display: grid; gap: 8px; justify-items: end; text-align: right; min-width: 0; }
.mast-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.mast-asof { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 14px; }
.mast-asof b { color: var(--ink); font-weight: 600; }
.pillbtn { all: unset; cursor: pointer; border-radius: 2px; }
.pillbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pillbtn:hover .pill { filter: brightness(0.97); text-decoration: underline; text-underline-offset: 2px; }

/* DADOS SIMULADOS: faixa listrada entre filetes de tinta, carimbo em capitulares entre estrelas */
.sim-band {
  background: repeating-linear-gradient(135deg, var(--sim) 0 14px, var(--sim-2) 14px 28px);
  color: var(--sim-ink); border-block: 2px solid var(--sim-ink);
}
.sim-in { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 9px; }
.sim-tag {
  display: inline-flex; align-items: center; gap: 9px; padding: 7px 12px 6px; border: 2px solid var(--sim-ink); border-radius: 1px;
  background: var(--sim); font: 700 17px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase;
}
.sim-tag::before, .sim-tag::after { content: ""; flex: none; width: 13px; height: 13px; background: currentColor; }
.sim-txt { font-weight: 600; font-size: 13.5px; }

/* ---------- abas: o chão sob o horizonte; a régua com estrela da marca marca onde você está ---------- */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--chao); border-bottom: 1px solid var(--chao-line);
}
.tabs-in { display: flex; align-items: stretch; gap: 6px; min-height: 50px; } /* a altura das abas já no carregamento */
/* emblema: a cabeça da cabra recortada da marca, que fica à vista com as abas presas no topo */
.tabs-in::before {
  content: ""; flex: none; align-self: center; width: 39px; height: 32px; background: var(--tinta);
  -webkit-mask: var(--marca-cabra) center / contain no-repeat; mask: var(--marca-cabra) center / contain no-repeat;
}
/* quando as abas não cabem (tela estreita, fonte de reserva sem a Plex) elas rolam e as bordas
   esmaecem; o scroll-padding traz a aba ativa ou focada para fora do esmaecimento. Com as abas
   inteiras à vista o esmaecimento cai no recuo vazio e não aparece. */
.tablist {
  display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0;
  padding-inline: 10px 28px; scroll-padding-inline: 10px 28px;
  -webkit-mask: linear-gradient(90deg, transparent, #000 10px calc(100% - 28px), transparent);
  mask: linear-gradient(90deg, transparent, #000 10px calc(100% - 28px), transparent);
}
.tablist::-webkit-scrollbar { display: none; }
.tab {
  position: relative; appearance: none; border: 0; background: none; cursor: pointer; white-space: nowrap;
  padding: 14px 10px 15px; font-size: 14px; font-weight: 500; color: var(--ink-2);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] {
  color: var(--ink); font-weight: 600;
  background:
    linear-gradient(var(--sol), var(--sol)) left 8px bottom 5px / calc(50% - 17px) 2px no-repeat,
    linear-gradient(var(--sol), var(--sol)) right 8px bottom 5px / calc(50% - 17px) 2px no-repeat;
}
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 12px; height: 12px; margin-left: -6px; }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
/* dados simulados: faixa listrada fixa sob as abas (lembrete ao rolar) */
.tabs.sim { border-bottom: 0; }
.tabs.sim::after {
  content: ""; display: block; height: 6px; border-top: 1px solid var(--sim-ink);
  background: repeating-linear-gradient(135deg, var(--sim) 0 10px, var(--sim-2) 10px 20px);
}

/* ---------- painéis ---------- */
/* abas curtas: o miolo ocupa a janela e o rodapé desce, sem mudar o modelo de layout do body */
main.wrap { padding-block: 30px 48px; min-height: 64vh; }
.panel { --vao: 36px; display: grid; gap: var(--vao); grid-template-columns: minmax(0, 1fr); }
.sec { position: relative; display: grid; gap: 14px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
/* título de seção: capitulares da marca, a estrela e o filete de tipografia (grosso + fino) */
.sec-h {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding-bottom: 12px;
  background:
    linear-gradient(var(--filete), var(--filete)) left bottom / 100% 2px no-repeat,
    linear-gradient(var(--filete), var(--filete)) left calc(100% - 5px) / 100% 1px no-repeat;
}
/* a estrela marca a primeira linha (centrada na altura de linha de 1,2em), também quando o título quebra */
.sec-h h2 { display: inline-flex; align-items: flex-start; gap: 11px; font: 600 22px/1.2 var(--font-display); letter-spacing: 0.045em; }
.sec-h h2::before { content: ""; flex: none; width: 15px; height: 15px; margin-top: calc(0.6em - 7.5px); }
.sec-h .sub { color: var(--muted); font-size: 13px; }
/* renda de bilro entre seções: bico com losango e picô, a estrela no vão (as duas centradas no vão
   --vao do painel, a estrela 1,5 px acima do eixo da renda, como no desenho) */
.panel > .sec + .sec::before, .panel > .sec + .sec::after { content: ""; position: absolute; left: 50%; pointer-events: none; }
.panel > .sec + .sec::before {
  top: calc(var(--vao) / -2 - 7px); width: min(344px, 80%); height: 14px; transform: translateX(-50%); background: var(--renda);
  -webkit-mask: var(--orn-renda) center / contain no-repeat; mask: var(--orn-renda) center / contain no-repeat;
}
.panel > .sec + .sec::after { top: calc(var(--vao) / -2 - 9px); width: 15px; height: 15px; margin-left: -7.5px; }
h3 { font-size: 15px; font-weight: 600; }
h4 { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.block {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 20px 22px; display: grid; gap: 14px; min-width: 0; align-content: start; grid-template-columns: minmax(0, 1fr);
}
.block-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding-bottom: 9px; border-bottom: 1px solid var(--grid); }
.block-h .sub { color: var(--muted); font-size: 12.5px; }
/* títulos de bloco e de cartão: Alegreya, a voz da narrativa */
.block-h h3, .card > h3, .th-theme h3, .worst h3, .reading h3 { font: 700 17.5px/1.25 var(--font-serif); letter-spacing: 0.003em; }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; align-content: start; grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1080px) { .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) { .cols, .cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); } }
.note { color: var(--muted); font-size: 12.5px; max-width: 92ch; }
.empty {
  border: 1px dashed var(--line); border-radius: var(--r); padding: 18px 20px; color: var(--ink-2);
  background: var(--surface-3); max-width: 92ch;
}
.lead { font: 400 17.5px/1.55 var(--font-serif); max-width: 74ch; color: var(--ink); }
.go { all: unset; cursor: pointer; color: var(--accent); font-weight: 500; font-size: 13px; }
.go:hover { text-decoration: underline; text-underline-offset: 2px; }
.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- indicadores: filete de prelo no topo ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--filete); border-radius: var(--r);
  padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; grid-template-columns: minmax(0, 1fr);
}
.tile-l { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tile-v { font-size: 23px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.tile-v small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.tile-v > .bars, .tile-v > .stack, .tile-v > .gauge-w { flex: 1 1 100%; width: 100%; font-size: 13px; font-weight: 400; letter-spacing: 0; }
.block .tile { border: 0; background: var(--surface-3); }
.block .alerts > li { background: none; border-bottom: 1px solid var(--grid); border-radius: 0; }
.block .alerts > li:last-child { border-bottom: 0; }
.tile-s { font-size: 12.5px; color: var(--muted); }
.trio { display: grid; gap: 2px; width: 100%; }
.trio > div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--grid); padding-bottom: 2px; }
.trio > div:last-child { border-bottom: 0; }
.trio b { font-size: 17px; font-weight: 600; order: 2; }
.trio span { font-size: 12.5px; color: var(--muted); font-weight: 400; letter-spacing: 0; order: 1; }
.kpis.k8 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .kpis.k8 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis.k8 { grid-template-columns: minmax(0, 1fr); } }

/* ---------- selos ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 2px;
  font-size: 12px; font-weight: 500; line-height: 1.65; white-space: nowrap;
  background: var(--na-bg); color: var(--na); max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.pill.k-ok::before, .pill.k-warn::before, .pill.k-crit::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.k-ok { background: var(--ok-bg); color: var(--ok); }
.k-warn { background: var(--warn-bg); color: var(--warn); }
.k-crit { background: var(--crit-bg); color: var(--crit); }
.k-info { background: var(--info-bg); color: var(--info); }
.k-na { background: var(--na-bg); color: var(--na); }
.k-sim { background: var(--sim); color: var(--sim-ink); font-weight: 700; letter-spacing: 0.1em; box-shadow: inset 0 0 0 1px var(--sim-ink); }
.k-accent { background: var(--accent-soft); color: var(--accent-2); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 2px;
  border: 1px solid var(--line); background: var(--surface); font-size: 12px; line-height: 1.7;
  white-space: nowrap; color: var(--ink-2);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.side { display: inline-block; padding: 0 6px; border-radius: 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.5; }
.side.L { background: var(--long-soft); color: var(--long); }
.side.S { background: var(--short-soft); color: var(--short); }
.stance { display: inline-block; min-width: 2.2em; text-align: center; padding: 0 4px; border-radius: 2px; font-weight: 600; font-size: 12px; border: 1px solid var(--line); }
.stance.up { color: var(--long); border-color: var(--long); }
.stance.down { color: var(--short); border-color: var(--short); }
.sq { font-size: 12px; font-weight: 500; padding: 0 6px; border-radius: 2px; }
.sq.HIGH { background: var(--crit-bg); color: var(--crit); }
.sq.MEDIUM { background: var(--warn-bg); color: var(--warn); }
.sq.LOW { background: var(--na-bg); color: var(--ink-2); }
.sq.NA { background: var(--na-bg); color: var(--na); }

/* ---------- destaques ---------- */
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.alerts > li {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start;
  padding: 9px 12px; border-radius: 2px; background: var(--surface-3); border-left: 3px solid var(--line);
}
.alerts > li.t-crit { border-left-color: var(--crit-mark); }
.alerts > li.t-warn { border-left-color: var(--warn-mark); }
.alerts > li.t-info { border-left-color: var(--info); }
.alerts > li.t-ok { border-left-color: var(--ok); }
.alerts > li > .pill { margin-top: 1px; }
.alerts .list { margin-top: 4px; font-size: 13px; }

/* ---------- chave/valor ---------- */
.kv { display: grid; grid-template-columns: fit-content(44%) minmax(0, 1fr); gap: 7px 18px; margin: 0; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 520px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 0; } .kv dd { margin-bottom: 8px; } }

/* ---------- tabelas: filetes de prelo (2 px de tinta no topo, filete sob o cabeçalho) ---------- */
.scroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-top: 2px solid var(--filete); border-radius: var(--r); background: var(--surface); }
.scroll.tall { max-height: 560px; overflow-y: auto; }
@media (max-width: 640px) { .scroll.stackable.tall { max-height: none; overflow-y: visible; } }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th {
  text-align: left; font-weight: 600; color: var(--ink); background: var(--surface-2); letter-spacing: 0.01em;
  padding: 8px 10px; white-space: nowrap; font-size: 12px; vertical-align: bottom;
  position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--ink-2);
}
.tbl td { padding: 7px 10px; border-top: 1px solid var(--grid); vertical-align: top; white-space: nowrap; }
.tbl tbody tr:first-child > td { border-top: 0; }
.tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl tbody tr:hover > td { background: var(--surface-3); }
.tbl tr.st-crit > td:first-child { box-shadow: inset 3px 0 0 var(--crit-mark); }
.tbl tr.st-warn > td:first-child { box-shadow: inset 3px 0 0 var(--warn-mark); }
.tbl tr.st-info > td:first-child { box-shadow: inset 3px 0 0 var(--info); }
.tbl tr.grp > td { background: var(--surface-3); font-weight: 600; color: var(--ink); }
.tbl tr.sel > td, .tbl td.selcol { background: var(--accent-soft); }
.tbl .wrapcell { min-width: 240px; max-width: 560px; white-space: normal; }
.tbl .sticky { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.tbl th.sticky { z-index: 2; background: var(--surface-2); }
.tbl tbody tr:hover > td.sticky { background: var(--surface-3); }
.sortbtn { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.sortbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sortbtn .ar { color: var(--muted); font-size: 11px; }
.cellsub { display: block; color: var(--muted); font-size: 12px; }
.rowbtn { all: unset; cursor: pointer; color: var(--accent); font-size: 12px; padding: 0 4px; }
.rowbtn:focus-visible { outline: 2px solid var(--accent); }
tr.detail > td { background: var(--surface-3); padding: 16px; white-space: normal; }
tr.detail:hover > td { background: var(--surface-3); }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; white-space: normal; max-width: 1200px; }
.detail-in { position: sticky; left: 16px; max-width: 100%; }
.bars .gap-row { grid-column: 1 / -1; color: var(--muted); font-size: 12px; text-align: center; letter-spacing: 0.2em; line-height: 1; }
.na-txt { color: var(--muted); font-style: italic; }

/* ---------- barras ---------- */
.bars { display: grid; grid-template-columns: minmax(80px, 34%) minmax(0, 1fr) max-content; gap: 6px 12px; align-items: center; font-size: 13px; }
.bl { overflow-wrap: anywhere; line-height: 1.3; }
.bl small { display: block; color: var(--muted); font-size: 12px; }
.bt { position: relative; height: 16px; }
.bars.div .bt::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.bars:not(.div) .bt::before { content: ""; position: absolute; left: 0; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.bf { position: absolute; top: 3px; height: 10px; border-radius: 0 2px 2px 0; min-width: 1px; }
.bf.n { border-radius: 2px 0 0 2px; }
.bref { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dotted var(--ink-2); }
.bv { text-align: right; white-space: nowrap; }
.bv small { display: block; color: var(--muted); font-size: 12px; }
.bars-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); }
.bars-legend i { display: inline-block; width: 0; height: 11px; border-left: 2px dotted var(--ink-2); margin-right: 6px; vertical-align: -1px; }
/* long × short (borboleta): short à esquerda do centro, long à direita, traço = net */
.ls { position: relative; height: 18px; min-width: 140px; }
.ls::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.ls-l, .ls-s { position: absolute; top: 3px; height: 12px; }
.ls-l { left: 50%; background: var(--long); border-radius: 0 2px 2px 0; opacity: 0.85; }
.ls-s { right: 50%; background: var(--short); border-radius: 2px 0 0 2px; opacity: 0.85; }
.ls-n { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.ls-lim { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1px dashed var(--muted); }
.ls-key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); align-items: center; }
.ls-key i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.ls-key i.n { width: 3px; height: 12px; background: var(--ink); }
.ls-key i.lim { width: 0; height: 12px; border-left: 1px dashed var(--muted); border-radius: 0; }
/* participação na variância: barra empilhada */
.shares { display: grid; gap: 8px; }
.shares-bar { display: flex; height: 26px; border-radius: 2px; overflow: hidden; background: var(--grid); }
.shares-bar > span { height: 100%; min-width: 2px; }
.shares-key { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; }
.shares-key span { display: inline-flex; align-items: center; gap: 6px; }
.shares-key i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }

/* uso do limite */
.ubw { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.ub { position: relative; flex: 1 1 auto; height: 7px; background: var(--grid); border-radius: 4px; min-width: 70px; }
.ub-f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ink-2); }
.ub-m { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.ub-m.lim { width: 2px; background: var(--ink); }
.ub.t-ok .ub-f { background: var(--accent); }
.ub.t-near .ub-f { background: var(--warn-mark); }
.ub.t-warn .ub-f { background: var(--warn-mark); }
.ub.t-crit .ub-f { background: var(--crit-mark); }
.ub.t-info .ub-f { background: var(--info); }
.ub.t-na .ub-f { background: var(--na); }
.ubv { font-size: 12.5px; min-width: 3.4em; text-align: right; }
.ub-legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.ub-legend i { display: inline-block; width: 1px; height: 10px; background: var(--muted); margin-right: 5px; vertical-align: -1px; }
.ub-legend i.lim { width: 2px; background: var(--ink); }
/* pisos: região abaixo do piso hachurada */
.fg { display: grid; gap: 3px; min-width: 150px; }
.fg-t { position: relative; height: 7px; background: var(--grid); border-radius: 4px; }
.fg-below { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px 0 0 4px; background: repeating-linear-gradient(135deg, var(--crit-bg) 0 4px, var(--grid) 4px 8px); }
.fg-floor { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.fg-mk { position: absolute; top: -4px; bottom: -4px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--accent); }
.fg.t-warn .fg-mk, .fg.t-info .fg-mk { background: var(--warn-mark); }
.fg.t-crit .fg-mk { background: var(--crit-mark); }
.fg-txt { font-size: 12px; color: var(--ink-2); white-space: normal; }

/* banda de vol */
.gauge { position: relative; height: 26px; margin-top: 4px; }
.g-track { position: absolute; left: 0; right: 0; top: 9px; height: 8px; background: var(--grid); border-radius: 4px; }
.g-band { position: absolute; top: 9px; height: 8px; background: var(--band); border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
.g-tgt { position: absolute; top: 5px; height: 16px; width: 2px; background: var(--ok); }
.g-mk { position: absolute; top: 2px; width: 12px; height: 22px; margin-left: -6px; }
.g-mk::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.g-mk::after { content: ""; position: absolute; left: 1px; top: 0; border: 5px solid transparent; border-top-color: var(--ink); }
.g-lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.gauge.mini { height: 20px; min-width: 120px; }
.gauge.mini .g-track, .gauge.mini .g-band { top: 6px; height: 7px; }
.gauge.mini .g-tgt { top: 3px; height: 13px; }
.gauge.mini .g-mk { top: 0; height: 18px; }

/* níveis de drawdown */
.ladder { display: grid; gap: 6px; }
.lad-track { position: relative; height: 32px; border-radius: 2px; overflow: hidden; display: flex; }
.lad-seg { height: 100%; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 6px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; }
.lad-seg.s0 { background: var(--ok-bg); color: var(--ok); }
.lad-seg.s1 { background: var(--warn-bg); color: var(--warn); }
.lad-seg.s2 { background: var(--crit-bg); color: var(--crit); }
.lad-seg.s3 { background: var(--crit); color: var(--on-accent); }
.lad-wrap { position: relative; padding-top: 34px; }
.lad-mk { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); margin-left: -1px; }
.lad-mk span { position: absolute; top: 0; left: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--ink); line-height: 14px; }
.lad-mk.r span { left: auto; right: 4px; }
.lad-mk.ghost { background: var(--muted); top: 17px; }
.lad-mk.ghost span { color: var(--ink-2); font-weight: 500; }
.lad-ticks { position: relative; height: 16px; font-size: 12px; color: var(--muted); }
.lad-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.lad-ticks span:first-child { transform: none; }
.ladder.mini .lad-track { height: 10px; }
.ladder.mini .lad-seg { font-size: 0; padding: 0; }
.ladder.mini .lad-wrap { padding-top: 0; }
.ladder.mini .lad-mk, .ladder.mini .lad-mk.ghost { top: -3px; bottom: -3px; }
.ladder.mini .lad-mk span { display: none; }

/* ---------- gráficos SVG (paleta de dados; o sol nunca entra num gráfico) ---------- */
.chart { position: relative; min-width: 0; }
.chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .gridl { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .band { fill: var(--band); }
.chart .zone { fill: var(--surface-3); }
.chart .zonel { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .zonet { fill: var(--muted); font-size: 12px; }
.chart .refl { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 3; }
.chart .reft { fill: var(--ink-2); font-size: 12px; }
.chart .xhair { stroke: var(--ink-2); stroke-width: 1; }
.chart .enddot { stroke: var(--surface); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.sq2 { width: 10px; height: 10px; border-radius: 2px; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--ink-2); border-radius: 2px; padding: 7px 9px; font-size: 12.5px;
  box-shadow: 0 4px 14px var(--tip-shadow); min-width: 150px; max-width: 280px;
}
.tip b { display: block; margin-bottom: 2px; }
.tip div { display: flex; justify-content: space-between; gap: 12px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.src { font-size: 12px; color: var(--muted); }

/* ---------- controles: seleção = carimbo (tinta invertida) ---------- */
.ctrl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }
.field { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.field select, .field input {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 2px;
  padding: 6px 8px; font-size: 13px; min-width: 120px; max-width: 100%;
}
.field input[type="search"] { min-width: 200px; }
@media (max-width: 520px) { .field input[type="search"] { min-width: 0; width: 100%; } .field { flex: 1 1 140px; } }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; background: var(--surface); }
.seg button { appearance: none; border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-ink); font-weight: 600; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 2px; padding: 6px 12px; cursor: pointer; font-size: 13px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.count { font-size: 12.5px; color: var(--muted); }

/* blocos recolhíveis */
details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
details.fold > summary { cursor: pointer; padding: 13px 18px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-2px) rotate(-45deg); transition: transform 0.15s; flex: none; align-self: center; }
details.fold[open] > summary::before { transform: translateY(-3px) rotate(45deg); }
details.fold > summary .sub { font-weight: 400; color: var(--muted); font-size: 12.5px; }
details.fold > .fold-b { padding: 0 18px 18px; display: grid; gap: 14px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
details.mini > summary { cursor: pointer; color: var(--accent); font-size: 13px; }

/* ---------- narrativa (Markdown): Alegreya com algarismos alinhados, estrelas nos marcadores ---------- */
.md {
  max-width: 74ch; font: 400 17px/1.58 var(--font-serif); color: var(--ink); overflow-wrap: anywhere;
}
.md > * + * { margin-top: 0.7em; }
.md h1 { font: 700 23px/1.25 var(--font-serif); margin-top: 0.4em; }
.md h2 { font: 700 21px/1.3 var(--font-serif); margin-top: 1.1em; }
.md h3 { font: 700 16.5px/1.35 var(--font-serif); margin-top: 1em; }
.md h4 { font: 700 15px/1.4 var(--font-serif); margin-top: 0.9em; color: var(--ink); letter-spacing: 0; text-transform: none; }
:where(.md) :where(p, ul, ol) { margin: 0; }
.md ol { padding-left: 1.3em; }
.md ul { list-style: none; padding-left: 1.35em; }
.md ul > li { position: relative; }
.md ul > li::before { content: ""; position: absolute; left: -1.22em; top: 0.4em; width: 0.68em; height: 0.68em; }
.md li + li { margin-top: 0.25em; }
.md strong { font-weight: 600; }
.md blockquote { margin-inline: 0; margin-bottom: 0; padding: 8px 14px; border-left: 3px solid var(--sol); background: var(--surface-3); color: var(--ink-2); font-style: italic; }
.md code { background: var(--surface-2); padding: 0 4px; border-radius: 2px; }
.md pre { margin-inline: 0; margin-bottom: 0; background: var(--surface-2); padding: 10px; border-radius: 2px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md .mdt { overflow-x: auto; max-width: 100%; }
.md table { border-collapse: collapse; font: 400 13px/1.45 var(--font-body); }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); font-weight: 600; }
.md hr { border: 0; height: 15px; width: 15px; margin-inline: auto; }
.md.sm, .card .md { font-size: 15.5px; }
.md-plain { white-space: pre-wrap; font-family: var(--font-mono); font-size: 12.5px; margin: 0; }
.txt { white-space: pre-wrap; max-width: 85ch; overflow-wrap: anywhere; }
.prose { font: 400 17px/1.62 var(--font-serif); max-width: 74ch; }
.thesis-title { font: 700 34px/1.12 var(--font-serif); max-width: 38ch; }
.thesis-meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }

/* comitê */
.weeks { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.wk {
  appearance: none; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--r); padding: 9px 13px; display: grid; gap: 3px; min-width: 150px; color: var(--ink);
}
.wk[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 -3px 0 var(--sol); }
.wk b { font-size: 14px; }
.wk span { font-size: 12px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.cards.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 9px; align-content: start; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.card-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; justify-content: space-between; }
.list { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 13.5px; }
.evid { font-size: 12.5px; display: grid; gap: 2px; }
.evid a { overflow-wrap: anywhere; }
.reading { display: grid; gap: 18px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.reading > div { display: grid; gap: 8px; align-content: start; min-width: 0; }
@media (max-width: 1080px) { .reading { grid-template-columns: minmax(0, 1fr); } }

/* relatórios */
.rep { display: grid; grid-template-columns: minmax(220px, 290px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .rep { grid-template-columns: minmax(0, 1fr); } }
.replist { display: grid; gap: 4px; max-height: 70vh; overflow-y: auto; align-content: start; }
@media (min-width: 901px) { .replist { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); } }
@media (max-width: 900px) { .replist { max-height: 300px; } }
.repitem {
  appearance: none; text-align: left; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  border-radius: 2px; padding: 8px 11px; display: flex; justify-content: space-between; gap: 8px; align-items: center; color: var(--ink);
}
.repitem[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); }
.repitem small { color: var(--muted); }
.repitem[aria-pressed="true"] small { color: var(--ink-2); }
.comment { border-left: 3px solid var(--sol); background: var(--surface); padding: 14px 18px; border-radius: 0 var(--r) var(--r) 0; display: grid; gap: 8px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }

/* ---------- rodapé: contracapa de tinta nos dois temas, a chapada e o sol listrado da marca ---------- */
.foot {
  --ink: #f1e8d6; --ink-2: #d6c9b1; --muted: #b3a58e; --line: #4d4034; --grid: #3a2f25;
  --surface: #2b2219; --surface-2: #33291f; --surface-3: #2e251c;
  --accent: #b3c3f2; --accent-2: #d0dbfa; --on-accent: #1d1611; --sel-bg: #f1e8d6; --sel-ink: #1d1611;
  display: flow-root; position: relative; isolation: isolate; margin-top: 124px; min-height: 120px; color: var(--ink-2);
  background: var(--foot-bg) var(--orn-rachado) 0 0 / 260px 260px;
  /* a terra continua abaixo do rodapé quando a página é mais curta que a janela */
  box-shadow: 0 100vh 0 100vh var(--foot-bg);
}
/* a chapada do Araripe (paredão entalhado, mandacaru, rachaduras) subindo do papel */
.foot::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: calc(100% - 1px); height: 90px; background: var(--foot-bg);
  -webkit-mask: var(--orn-chapada) 50% 100% / 1440px 90px repeat-x; mask: var(--orn-chapada) 50% 100% / 1440px 90px repeat-x;
}
/* o sol listrado da marca nascendo atrás da chapada */
.foot::after {
  content: ""; position: absolute; z-index: -1; bottom: calc(100% + 33px); left: calc(50% - 116px); width: 72px; height: 72px;
  border-radius: 50%; pointer-events: none; clip-path: inset(0 0 25px 0);
  background:
    linear-gradient(var(--sol) 0 25px, transparent 25px),
    repeating-linear-gradient(var(--sol) 0 4px, transparent 4px 6.5px) 0 25px / 100% 100% no-repeat;
}
.foot-in { position: relative; padding-block: 34px 210px; display: grid; gap: 16px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); font-size: 13px; }
@media (max-width: 900px) { .foot-in { grid-template-columns: minmax(0, 1fr); } }
/* assinatura: a marca completa, com "ASSET MANAGEMENT" e a régua com estrela, em osso e sol */
.foot-in::before, .foot-in::after {
  content: ""; position: absolute; left: 50%; bottom: 44px; width: 220px; margin-left: -110px; aspect-ratio: var(--marca-proporcao);
  background: var(--ink); pointer-events: none;
  -webkit-mask: var(--marca-tinta) center / contain no-repeat; mask: var(--marca-tinta) center / contain no-repeat;
}
.foot-in::after { background: var(--sol); -webkit-mask-image: var(--marca-sol); mask-image: var(--marca-sol); }
.foot h2 { font: 600 16px/1.3 var(--font-display); letter-spacing: 0.04em; color: var(--ink); margin-bottom: 8px; }
.disc { display: grid; gap: 8px; max-width: 92ch; }
.foot-side { display: grid; gap: 10px; align-content: start; justify-items: start; }
.foot-side > p:first-child b { font: 600 15px/1.3 var(--font-display); letter-spacing: 0.05em; color: var(--ink); }
.fatal { margin: 40px auto; max-width: 70ch; }

/* carregamento e erro */
.boot { display: grid; gap: 10px; max-width: 72ch; margin: 24px 0 8px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--sol); border-radius: var(--r); }
.boot h2 { font: 600 20px/1.25 var(--font-display); letter-spacing: 0.04em; }
.boot p { color: var(--ink-2); }
.boot.err { border-left-color: var(--crit-mark); }
.boot.err h2 { color: var(--crit); }
.boot-bar { position: relative; height: 3px; border-radius: 2px; background: var(--grid); overflow: hidden; }
.boot-bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 2px; background: var(--sol); animation: boot-slide 1.1s ease-in-out infinite; }
@keyframes boot-slide { from { left: -35%; } to { left: 100%; } }
.boot code { font-size: 12px; overflow-wrap: anywhere; }
.boot .btn { justify-self: start; }
.trunc { color: var(--muted); font-size: 12px; font-style: italic; }

/* ---------- tese de investimento ---------- */
.th-top { gap: 18px; }
.th-head { display: grid; gap: 10px; }
.thesis-meta > span + span::before { content: "·"; margin-right: 12px; color: var(--muted); }
.thesis-meta > .pill + span::before { content: none; }
.md.lead-md { font-size: 19px; line-height: 1.55; max-width: 68ch; }
/* capitular de xilogravura: letra de papel recortada num bloco de tinta */
.md.lead-md > p:first-child::first-letter {
  float: left; font: 700 2.9em/0.82 var(--font-display); margin: 0.1em 0.14em 0 0; padding: 0.13em 0.13em 0.07em;
  background: var(--tinta); color: var(--bg);
}
.th-kpis { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.tnav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; background-color: var(--bg); background-image: var(--grao); border-bottom: 1px solid var(--filete); }
.tnav::-webkit-scrollbar { display: none; }
@media (min-width: 901px) { .tnav { position: sticky; z-index: 15; flex-wrap: wrap; } }
.tnav-b { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 2px; padding: 3px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.tnav-b:hover { border-color: var(--accent); color: var(--accent); }
.tnav-b.on { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-ink); }
.th-s { scroll-margin-top: 112px; }
@media (max-width: 900px) { .th-s { scroll-margin-top: 64px; } }
.th-prose { max-width: 76ch; display: grid; gap: 6px; }
.th-prose .md { font-size: 17px; }
/* tema long e short ao mesmo tempo: selo neutro (nem mandacaru nem barro) */
.side.LS { background: var(--surface-2); color: var(--ink); }
.nchip { display: inline-flex; align-items: baseline; gap: 6px; padding: 1px 8px; border-radius: 2px; font-size: 12.5px; line-height: 1.6; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.nchip.L { border-color: transparent; background: var(--long-soft); color: var(--long); }
.nchip.S { border-color: transparent; background: var(--short-soft); color: var(--short); }
.nchip.LS { background: var(--surface-2); color: var(--ink); }
.nchip b { font-weight: 600; }
.nchip.thc { white-space: normal; max-width: 100%; overflow-wrap: anywhere; }
.nchip.thc b { white-space: nowrap; }
.mm { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px 14px; margin: 0; padding-top: 10px; border-top: 1px solid var(--grid); }
.mm dt { font-size: 12px; color: var(--muted); }
.mm dd { margin: 0; font-weight: 600; font-size: 14px; }
.fn { display: grid; gap: 8px; }
.fn-r { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr) max-content; gap: 6px 12px; align-items: center; font-size: 13px; }
.fn-t { display: flex; justify-content: center; height: 22px; }
.fn-b { height: 100%; border-radius: 2px; min-width: 2px; }
.fn-b.f0 { background: var(--grid); border: 1px solid var(--line); }
.fn-b.f1 { background: var(--accent-soft); border: 1px solid var(--accent); }
.fn-b.f2 { background: var(--accent); }
.chart .vb { fill: var(--c6); opacity: 0.55; }
.chart .vb.on { fill: var(--accent); opacity: 1; }
.chart .vb.fl { fill: none; opacity: 1; stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .vbs { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart .vbv { fill: var(--ink); font-weight: 600; }
.vb-notes { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.vb-notes b { color: var(--ink); font-weight: 600; }
.bars.bf3 .ls { min-width: 0; }
.bars .bv b { font-weight: 600; }
.td-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; white-space: normal; align-items: start; }
@media (max-width: 1100px) { .td-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .td-txt { grid-column: 1 / -1; } }
.td-txt h4 { margin-bottom: 4px; }
.tbl.tp tbody tr.tp-r { cursor: pointer; }
.tbl .wc { min-width: 150px; white-space: normal; color: var(--ink-2); }
.worst .card { border-top: 3px solid var(--crit-mark); }
.wv { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.wv small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.na-list { display: grid; gap: 4px; }
.na-list .list { font-size: 12.5px; color: var(--ink-2); }
/* linha do tempo: pesponto (costura de couro) e estrelas */
.tl-g { display: grid; gap: 16px; }
.tl-w { display: grid; gap: 6px; }
.tl { list-style: none; margin: 0 0 0 5px; padding: 0; border-left: 2px dashed var(--line); }
.tl-i { position: relative; display: grid; grid-template-columns: 70px 86px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 5px 0 5px 14px; font-size: 13.5px; }
.tl-i::before { content: ""; position: absolute; left: -8px; top: 9px; width: 14px; height: 14px; }
.tl-d { color: var(--ink); font-weight: 600; white-space: nowrap; }
.tl-t { min-width: 0; overflow-wrap: anywhere; }
.tl-t .chips { margin-top: 4px; }
.kc { justify-self: start; font-size: 12px; padding: 0 6px; border-radius: 2px; line-height: 1.6; white-space: nowrap; background: var(--na-bg); color: var(--ink-2); }
.kc-resultado { background: var(--accent-soft); color: var(--accent-2); }
.kc-catalisador { background: var(--long-soft); color: var(--long); }
.kc-evento { background: var(--warn-bg); color: var(--warn); }
.tl-c .tl-t { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.th-notes { display: grid; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; max-width: 110ch; }
.th-notes h3 { font-size: 13px; color: var(--ink-2); }
.th-notes .list { font-size: 12.5px; }
/* visão geral: o destaque da tese é a capa de um folheto de cordel — moldura dupla de tinta
   aberta no topo para a estrela (só gradientes, sem remendo de fundo) */
.th-hl {
  position: relative; border: 0; padding: 30px 30px 26px;
  background:
    linear-gradient(var(--filete), var(--filete)) left top / calc(50% - 21px) 2px no-repeat,
    linear-gradient(var(--filete), var(--filete)) right top / calc(50% - 21px) 2px no-repeat,
    linear-gradient(var(--filete), var(--filete)) left bottom / 100% 2px no-repeat,
    linear-gradient(var(--filete), var(--filete)) left top / 2px 100% no-repeat,
    linear-gradient(var(--filete), var(--filete)) right top / 2px 100% no-repeat,
    linear-gradient(var(--filete), var(--filete)) left 6px top 6px / calc(50% - 27px) 1px no-repeat,
    linear-gradient(var(--filete), var(--filete)) right 6px top 6px / calc(50% - 27px) 1px no-repeat,
    linear-gradient(var(--filete), var(--filete)) left 6px bottom 6px / calc(100% - 12px) 1px no-repeat,
    linear-gradient(var(--filete), var(--filete)) left 6px top 6px / 1px calc(100% - 12px) no-repeat,
    linear-gradient(var(--filete), var(--filete)) right 6px top 6px / 1px calc(100% - 12px) no-repeat,
    var(--surface);
}
.th-hl::before { content: ""; position: absolute; top: -10px; left: 50%; width: 24px; height: 24px; margin-left: -12px; }
.th-hl-t { font: 700 25px/1.2 var(--font-serif); max-width: 44ch; }
.btn-p { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-ink); font-weight: 600; letter-spacing: 0.01em; }
.btn-p:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ov-first .lead { font-weight: 600; }
.kpis.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 1100px) { .kpis.k5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis.k5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.rs-v { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rs-v b { font-size: 22px; font-weight: 600; }
.rs-c { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
/* algarismos da Alegreya: os de texto (o padrão dela) fazem "10" parecer "Io"; títulos, aberturas e
   narrativa usam os alinhados. Vem depois de toda regra com o atalho `font:` (que zera
   font-variant-numeric); tabelas do Markdown voltam aos tabulares do corpo. */
.lead, .prose, .md, .md h1, .md h2, .md h3, .md h4, .thesis-title, .th-hl-t,
.block-h h3, .card > h3, .th-theme h3, .worst h3, .reading h3 { font-variant-numeric: lining-nums proportional-nums; }
.md table { font-variant-numeric: lining-nums tabular-nums; }

/* ---------- larguras intermediárias: as nove abas e o emblema cabem (com a Plex) até ~1.270 px ---------- */
@media (max-width: 1320px) { .tab { padding-inline: 8px; } }
/* cabeçalho sem espaço para a coluna da direita: posição e selos numa linha sob a marca */
@media (max-width: 1120px) {
  .mast-side { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; text-align: left; }
  .mast-chips, .mast-asof { justify-content: flex-start; }
}
@media (max-width: 900px) { .thesis-title { font-size: 28px; } }
/* ---------- celular ---------- */
@media (max-width: 640px) {
  .mast-in { padding-block: 18px 0; gap: 14px; }
  .mast-side { display: grid; gap: 8px; justify-items: start; }
  .brand { gap: 14px; }
  /* a marca perde só a linha "ASSET MANAGEMENT" (ilegível abaixo de ~200 px); a assinatura do rodapé a mantém */
  .brand-mark { width: 128px; aspect-ratio: var(--marca-proporcao-topo); }
  .brand-txt { padding-left: 14px; gap: 4px; }
  .brand-name { font-size: 19px; letter-spacing: 0.04em; }
  .brand-sub { font-size: 12.5px; }
  .mast::before { bottom: 6px; height: 42px; -webkit-mask-size: 1200px 42px; mask-size: 1200px 42px; }
  .mast::after { height: 36px; margin-top: 6px; }
  .sim-tag { font-size: 14px; letter-spacing: 0.12em; }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; }
  .tabs-in { min-height: 46px; }
  .tabs-in::before { display: none; }
  .tablist {
    padding-left: 0; scroll-padding-inline: 0 28px;
    -webkit-mask: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
  }
  .tab { padding: 12px 10px 14px; font-size: 13.5px; }
  main.wrap { padding-block: 24px 40px; }
  .panel { --vao: 28px; }
  .sec-h h2 { font-size: 19px; }
  .block { padding: 15px; }
  .tile-v { font-size: 21px; }
  .thesis-title { font-size: 26px; }
  .md, .prose { font-size: 16px; }
  .md.lead-md, .lead { font-size: 17px; }
  .scroll.stackable { overflow-x: visible; border: 0; background: none; }
  .tbl.stackable, .tbl.stackable tbody { display: block; }
  .tbl.stackable thead { display: none; }
  .tbl.stackable tr { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-bottom: 8px; }
  .tbl.stackable tr.grp { border: 0; background: none; padding: 6px 0 0; }
  .tbl.stackable tr.st-crit { border-left: 3px solid var(--crit-mark); }
  .tbl.stackable tr.st-warn { border-left: 3px solid var(--warn-mark); }
  .tbl.stackable tr.st-info { border-left: 3px solid var(--info); }
  .tbl.stackable tr > td:first-child { box-shadow: none; }
  .tbl.stackable td { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; padding: 2px 0; white-space: normal; text-align: right; min-width: 0; }
  .tbl.stackable td::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-align: left; flex: none; max-width: 45%; }
  .tbl.stackable td:first-child { display: block; text-align: left; font-weight: 600; padding-bottom: 4px; }
  .tbl.stackable td:first-child::before { display: none; }
  .tbl.stackable td.wrapcell { display: block; text-align: left; min-width: 0; max-width: none; font-size: 12.5px; color: var(--ink-2); }
  .tbl.stackable td.wrapcell::before { display: block; }
  .tbl.stackable .ubw, .tbl.stackable .fg, .tbl.stackable .ls { min-width: 0; flex: 1 1 auto; max-width: 60%; }
  .tbl.stackable tbody tr:hover > td { background: none; }
  .tbl.stackable td:first-child .cellsub { font-weight: 400; }
  .tbl td.sticky { white-space: normal; min-width: 7.5em; max-width: 9.5em; overflow-wrap: anywhere; }
  .tbl .wbar { display: none !important; }
  .thesis-meta { flex-direction: column; align-items: flex-start; gap: 2px; }
  .thesis-meta > span + span::before { content: none; }
  .tbl.stackable tr.detail > td { display: block; padding: 4px 0; text-align: left; }
  .tbl.stackable tr.detail > td::before { display: none; }
  .td-grid { grid-template-columns: minmax(0, 1fr); }
  .tl-i { grid-template-columns: max-content minmax(0, 1fr); }
  .tl-t { grid-column: 1 / -1; }
  .fn-r { grid-template-columns: minmax(0, 1fr) max-content; }
  .fn-t { grid-column: 1 / -1; grid-row: 2; }
  .th-hl { padding: 26px 18px 22px; }
  .th-hl-t { font-size: 21px; }
  .alerts > li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .alerts > li > .pill { justify-self: start; }
  .foot { margin-top: 96px; }
  /* a chapada encolhe e o recorte mostra a borda do paredão e o mandacaru */
  .foot::before { height: 68px; -webkit-mask-size: 1080px 68px; mask-size: 1080px 68px; -webkit-mask-position: calc(50% - 175px) 100%; mask-position: calc(50% - 175px) 100%; }
  .foot::after {
    bottom: calc(100% + 25px); left: calc(50% - 102px); width: 54px; height: 54px; clip-path: inset(0 0 19px 0);
    background:
      linear-gradient(var(--sol) 0 19px, transparent 19px),
      repeating-linear-gradient(var(--sol) 0 3px, transparent 3px 5px) 0 19px / 100% 100% no-repeat;
  }
  .foot-in { padding-bottom: 170px; }
  .foot-in::before, .foot-in::after { width: 176px; margin-left: -88px; bottom: 36px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  .boot-bar::after { left: 0; width: 100%; opacity: 0.6; }
}
/* alto contraste do sistema (Windows): o fundo forçado (Canvas) apagaria as marcas pintadas por
   máscara; logo, emblema e assinatura saem na cor do texto, e a aba ativa ganha sublinhado */
@media (forced-colors: active) {
  .brand-mark::before, .brand-mark::after, .tabs-in::before, .foot-in::before, .foot-in::after {
    forced-color-adjust: none; background: CanvasText;
  }
  .tab[aria-selected="true"] { text-decoration: underline 2px; text-underline-offset: 6px; }
}
/* sem máscara CSS (navegador antigo): nada de ornamento recortado (sairiam blocos e quadrados de
   cor); a marca volta a ser o "CDP" em capitulares, na tinta */
@supports not ((-webkit-mask-image: none) or (mask-image: none)) {
  .brand-mark { width: auto; aspect-ratio: auto; font: 700 44px/1 var(--font-display); letter-spacing: 0.06em; color: var(--tinta); }
  .brand-mark::before, .brand-mark::after, .tabs-in::before, .foot-in::before, .foot-in::after, .mast::before, .mast::after,
  .foot::before, .panel > .sec + .sec::before, .sec-h h2::before, .eyebrow::before, .md ul > li::before, .md hr, .tl-i::before,
  .tab[aria-selected="true"]::after, .th-hl::before, .panel > .sec + .sec::after, .sim-tag::before, .sim-tag::after { display: none; }
  .md ul { list-style: disc; }
}
/* ---------- impressão: papel branco (os temas escuros valem só na tela), sem céu, horizonte, grão nem renda ---------- */
@media print {
  :root {
    --bg: #ffffff; --surface: #ffffff; --surface-3: #faf8f4; --ink: #000000; --grao: none;
    --ceu-1: #ffffff; --ceu-2: #ffffff; --ceu-brasa: transparent; --foot-bg: #ffffff; --chao: #ffffff;
  }
  html, body { background: #ffffff; }
  body { font-size: 11pt; }
  .tabs, .tnav, .ctrl, .seg, .btn, .rowbtn, .go, .boot, .weeks, .replist, .foot-side .seg { display: none !important; }
  .mast::before, .mast::after, .foot::before, .foot::after, .foot-in::before, .foot-in::after,
  .panel > .sec + .sec::before, .panel > .sec + .sec::after { display: none; }
  .mast { border-bottom: 2px solid var(--tinta); }
  .mast-in { padding-block: 12px; }
  /* filter achata a marca numa camada só no PDF: sem ele as máscaras saem com um filete na borda da
     caixa (cinza no Chromium/poppler, uma barra de sol à direita no Preview do Mac) */
  .brand-mark { width: 200px; filter: opacity(1); }
  .wrap { max-width: none; padding-inline: 0; }
  main.wrap { padding-block: 12px 0; min-height: 0; }
  .foot {
    --ink: #000000; --ink-2: #2e261e; --muted: #54483b; --line: #c9bea9; --grid: #e8e0d1;
    --surface: #ffffff; --surface-2: #efe8db; --surface-3: #faf8f4; --accent: #2b4596;
    margin-top: 16px; min-height: 0; background: #ffffff; box-shadow: none; border-top: 2px solid var(--tinta);
  }
  .foot-in { padding-block: 16px 0; }
  .block, .tile, .card, details.fold, .alerts > li, .tbl tr { break-inside: avoid; }
  /* no papel as grades do miolo viram blocos: um bloco que pula de página (break-inside: avoid)
     empurra o resto e o rodapé, em vez de a grade não crescer e o rodapé cobrir o fim da seção */
  .panel, .sec, .cols, .cols-2, .cols-3, .stack { display: block; }
  .panel > * + * { margin-top: 26px; }
  .sec > * + *, .cols > * + *, .cols-2 > * + *, .cols-3 > * + *, .stack > * + * { margin-top: 14px; }
  /* a estrela da capa do destaque fica dentro da caixa (borda de cima transparente) e pula de
     página junto com a capa, em vez de sobrar sozinha no pé da página anterior */
  .th-hl { border-top: 10px solid transparent; }
  .scroll, .scroll.tall { overflow: visible; max-height: none; }
  .sec-h { break-after: avoid; }
  a { color: inherit; text-decoration: none; }
  .brand-mark::before, .brand-mark::after, .sec-h, .sec-h h2::before, .eyebrow::before, .md ul > li::before,
  .th-hl, .th-hl::before, .tile, .scroll, .sim-band, .sim-tag, .pill, .side, .bf, .ls-l, .ls-s, .shares-bar > span, .lad-seg {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  @page { margin: 14mm 12mm; }
}

/* ====================================================================== carregamento */
/* Formas compactas do data.json publicado (sem perda; ver cdp.workflow.painel_publicacao):
   {"_colunas": {...}, "_n": N, "_faltam": {...}} = tabela em colunas ("a.b" = campo b do
   objeto a), {"_rep": {"v": [...], "n": [...]}} = coluna em corridas (valor v[k] repetido n[k]
   vezes) e {"_partes": [...]} = texto em partes. Desfeitas aqui, antes de qualquer uso. */
function unrep(c) {
  if (!c || typeof c !== "object" || Array.isArray(c) || !c._rep) return c || [];
  var v = c._rep.v || [], k = c._rep.n || [], out = [];
  for (var j = 0; j < v.length; j++) for (var t = 0; t < k[j]; t++) out.push(v[j]);
  return out;
}
function unpack(x) {
  if (Array.isArray(x)) { return x.map(unpack); }
  if (!x || typeof x !== "object") return x;
  var keys = Object.keys(x);
  if (keys.length === 1 && Array.isArray(x._partes)) return x._partes.join("");
  if (x._colunas && typeof x._colunas === "object" && typeof x._n === "number") {
    var n = x._n, miss = x._faltam || {}, rows = [], i;
    for (i = 0; i < n; i++) rows.push({});
    Object.keys(x._colunas).forEach(function (col) {
      var vals = unrep(x._colunas[col]), skip = {}, dot = col.indexOf(".");
      (miss[col] || []).forEach(function (j) { skip[j] = 1; });
      var a = dot > 0 ? col.slice(0, dot) : col, b = dot > 0 ? col.slice(dot + 1) : null;
      for (var r = 0; r < n; r++) {
        if (skip[r]) continue;
        var v = unpack(vals[r]);
        if (b === null) rows[r][a] = v;
        else {
          if (!rows[r][a] || typeof rows[r][a] !== "object" || Array.isArray(rows[r][a])) rows[r][a] = {};
          rows[r][a][b] = v;
        }
      }
    });
    return rows;
  }
  var out = {};
  keys.forEach(function (k) { out[k] = unpack(x[k]); });
  /* {"_igual": "<chave irmã>", ...}: o conteúdo da chave irmã com estes campos */
  keys.forEach(function (k) {
    var v = out[k], ref = v && typeof v === "object" && !Array.isArray(v) ? v._igual : null;
    var src = typeof ref === "string" ? out[ref] : null;
    if (!src || typeof src !== "object" || Array.isArray(src) || src._igual !== undefined) return;
    var cp = {};
    Object.keys(src).forEach(function (kk) { cp[kk] = src[kk]; });
    Object.keys(v).forEach(function (kk) { if (kk !== "_igual") cp[kk] = v[kk]; });
    out[k] = cp;
  });
  return out;
}

  if (kind !== "err") { var bar = document.createElement("div"); bar.className = "boot-bar"; bar.setAttribute("aria-hidden", "true"); b.appendChild(bar); }

    again.addEventListener("click", function () { load(); });

function inlineData() {

}
function run(data) {

    if (window.console) console.error(e);
    var m = document.getElementById("main");
    if (!m) return;
    var box = document.createElement("div");

    var t = document.createElement("h2"); t.textContent = "Falha ao montar o painel";
    var p = document.createElement("p"); p.textContent = "Os dados chegaram, mas a página não conseguiu montá-los. Recarregue a página; se o problema continuar, aguarde a próxima atualização.";
    box.appendChild(t); box.appendChild(p);
    m.insertBefore(box, m.firstChild);

}
var LOADING = false;
function load() {
  var inl = inlineData();
  if (inl) { run(unpack(inl)); return; }
  if (LOADING) return;
  LOADING = true;
  bootShow("load", "Carregando o painel…", "Lendo os dados mais recentes do fundo.");
  var slow = setTimeout(function () {
    bootShow("load", "Carregando o painel…", "A conexão está lenta: o portal aparece assim que os dados chegarem.");
  }, 12000);
  /* o investidor vê só a mensagem sobre os dados do fundo; o detalhe técnico (arquivo, HTTP) vai
     para o console e para um atributo oculto, para o diagnóstico de quem publica */
  function fail(e) {

load();
