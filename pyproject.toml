[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fechamento"
dynamic = ["version"]
description = "Fechamento — AI Notes #8: Redesenho do processo de elaboração do comentário de fechamento de mercado"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "streamlit>=1.35",
    "pandas>=2.2",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "numpy>=2.0",
    "scipy>=1.13",
    "cvxpy>=1.5",
    "clarabel>=0.9",
    "yfinance>=0.2.50",
    "pyarrow>=16",
    "plotly>=5.22",
    "exchange-calendars>=4.5",
    "pypdf>=6,<7",
    "lxml>=6.1.3,<7",
]

[project.scripts]
cdp = "cdp.__main__:main"
cdp-tecnicas = "cdp.tecnicas.cli:main"
cdp-tecnicas-mcp = "cdp.mcp_readonly.__main__:main"
cdp-mcp-operacional = "cdp.mcp_readonly.operacional:main"

[project.optional-dependencies]
mcp = [
    "mcp==2.3.0",
]
gemini = [
    "google-genai>=0.1.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # scripts/cdp_marca.py (máscaras WebP da marca do portal)
    "pillow>=10.0",
]
ai = [
    "anthropic>=0.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cdp = ["workflow/*.html", "recursos/sec_classes_acoes.json", "py.typed",
       "recursos/exemplos/latam_simulado_v1/*.json", "recursos/exemplos/latam_simulado_v1/*.yaml",
       "recursos/exemplos/latam_simulado_v1/*.csv", "recursos/exemplos/latam_simulado_v1/cobertura/*.csv",
       "recursos/exemplos/latam_simulado_v1/cobertura/*.yaml",
       "recursos/tecnicas/skills/*/SKILL.md", "recursos/tecnicas/*.md"]

[tool.setuptools.dynamic]
version = {attr = "cdp.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# pesquisa/: material de trabalho da mente arquivado para auditoria (não é código do pacote)
exclude = ["market-close-eval", ".venv", "pesquisa"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
]
