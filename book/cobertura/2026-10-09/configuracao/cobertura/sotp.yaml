# Soma das partes das holdings (CDP). Participações em empresas listadas do universo, cada fração
# com o documento público de onde foi lida (Formulário de Referência na CVM, 6-K/20-F na SEC,
# demonstrações ou relatório trimestral publicados pela companhia), as datas de referência e de
# publicação e a conferência cruzada com o documento da investida quando existe.
#
# Método: desconto da holding = mediana semanal de 5 anos de (valor de mercado da holding ÷ NAV
# com as mesmas participações). Por construção, o método é invariante a um erro proporcional
# constante na fração; não é invariante a mudanças da composição ou da base acionária — por isso:
# - "desde: AAAA-MM-DD" (por holding): a mediana usa só o período posterior à última mudança do
#   conjunto de participações (curada, com a fonte);
# - além disso, o código reinicia a janela na última variação > 5% das ações da holding fora de
#   desdobramentos (série de ações das demonstrações), e abaixo de 52 semanas usa o desconto de
#   reserva (sinalizado).
#
# "conferido: true" exige o endereço do documento e a data de publicação até a data do snapshot;
# com todas as frações conferidas e ≥ 52 semanas de histórico, a holding pode ter confiança B.
# "base": capital total (ações ordinárias + preferenciais) salvo indicação; participações
# indiretas pela participação econômica (look-through) com a conta na nota.
# Conferência cruzada (em código): "fracao_investida" é a posição acionária da holding no documento
# da investida (Formulário de Referência, composição acionária, 6-K), com "documento_investida";
# diferença acima de soma_partes.participacao_tolerancia (1 p.p., valuation.yaml) ⇒ participação não
# conferida (holding com confiança C). Sem o documento da investida (participação abaixo de 5%, sem
# posição divulgada), vale a conferência no documento da holding.
versao: "2026-10.3"
holdings:
