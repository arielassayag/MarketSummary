# Mandato do fundo LatAm L/S — qualquer alteração muda o config_hash e invalida aprovações.
# Valores calibrados com base em docs/research/03_construcao_long_short.md e
# docs/research/04_estrutura_mercado_latam.md.

fund:
  name: "CDP — Cabra da Peste"
  base_currency: USD
  inception_date: "2026-10-09"           # carteira inaugural, ao preço de fechamento (sempre dia de montagem)
  inception_nav_usd: 1000000             # PL inicial de US$ 1,0 mi (com US$ 100 mi a carteira esbarrava na liquidez de um único fechamento)
  rebalance_weekday: LAST_US_SESSION    # último pregão da semana na NYSE
  manager_role: "Gestor (PM)"
  manager_name: "CDP — Cabra da Peste"
  track_record_type: "paper trading com preços reais (execução hipotética no fechamento)"
  timezone: America/Sao_Paulo
  weekly_research_start_local: "11:00"   # dia de montagem: pesquisa e decisão com dados até o momento da análise
  decision_deadline_local: "15:00"       # teto; o prazo efetivo também respeita o fechamento mais cedo − 45 min
  execution_convention: "Decisão antes do fechamento do dia de montagem, com todos os dados disponíveis até o momento da análise; ordens em quantidade de ações; execução ao preço oficial de fechamento de cada linha (MOC), limitada à capacidade do leilão e da janela pré-fechamento; linha sem pregão no dia não negocia e o emissor mantém a posição"
  daily_close_run_local: "19:20"         # marcação, risco, atribuição, comentário e relatório
  primary_calendar: BVMF                 # calendário oficial da B3 (exchange_calendars)
  rebalance_rule: "último pregão da semana na NYSE (sexta-feira ou, com feriado nos EUA, o pregão anterior)"
  minds: [claude-code, codex]            # a "mente" do CDP: intercambiável, metodologia perene
  use_all_available_data: true           # inclui intradiário e notícias até o momento da análise

risk:
  vol_target_annual: 0.05      # meta ex-ante
  vol_band_min: 0.03           # abaixo: alerta (subutilização de risco)
  vol_band_max: 0.07           # acima: bloqueio
  net_exposure_max_abs: 0.01   # net neutral (tolerância operacional de 1% do NAV)
  beta_max_abs: 0.05           # beta previsto vs. mercado LatAm
  gross_max: 2.5
  gross_min: 0.5
  country_net_max_abs: 0.02           # alpha puro: país neutro (long ≈ short em cada país)
  sector_net_max_abs: 0.025          # setor neutro
  style_exposure_max_abs: 0.10          # fatores de estilo neutros (|z| <= 0,10)
  max_long_weight: 0.04
  max_short_weight: 0.025      # shorts menores: perda ilimitada e risco de squeeze
  min_position_weight: 0.002
  max_single_name_risk_share: 0.08
  max_factor_risk_share: 0.10          # fatia fatorial máxima na carteira ATINGIDA (κ_F incluso)
  idio_share_goal: 0.90                # meta idiossincrática (alerta) — modelos de decisão e base
  idio_share_floor: 0.85               # piso idiossincrático (bloqueia; nunca relaxado)
  factor_risk_basis: achieved          # teto fatorial sobre a carteira atingida, não a meta de vol
  factor_risk_aversion_multiplier: 5.0 # λ_F = 5·λ (fora da busca de κ do modo match)
  second_order_inflation: 1.45         # κ_F (razão realizada/prevista em carteiras otimizadas)
  second_order_inflation_mode: config  # o modo analítico fica para a validação
  idio_gate_models: [decisao, base]    # com e sem janelas de evento
  vol_floor_alpha_scaling: false       # nunca escalar o alpha para alcançar o piso da banda
  operational:                         # limites operacionais = min(mandato, operacional)
    beta: 0.02
    style: 0.05
    sector_net: 0.015
    country_net: {BR: 0.01, MX: 0.01, "*": 0.005}   # demais países: ±0,5% cada
    commodity_beta: 0.01
  risk_aversion: 1.0
  risk_target_mode: match              # o mandato TEM vol-alvo: usa o orçamento de risco (κ ≥ 1)
  var_confidence: 0.99
  theme_net_max_abs: {state_owned: 0.01}  # estatais neutras (janela eleitoral)
  country_gross_share_max: {BR: 0.70, MX: 0.35, CL: 0.15, PE: 0.12, CO: 0.10, AR: 0.10, LATAM: 0.10, PA: 0.05, UY: 0.05}
  commodity_proxies: {oil: "BZ=F", copper: "HG=F", gold: "GC=F"}   # betas neutralizados à parte
  commodity_beta_max_abs: 0.03         # 10% no Brent/cobre/ouro ⇒ ≤ 0,3% do NAV
  event_windows:
    # reaction_date: pregão de reação ao evento (1º pregão pós-1º turno). A reação residual de cada
    # emissor nesse dia mede a exposição ao "fator eleição"; |Σ w·reação| ≤ reaction_exposure_max_abs.
    - {name: "Eleição Brasil 2026 (2º turno 25/out)", country: BR, start: "2026-10-05", end: "2026-10-26", vol_multiplier: 1.5, reaction_date: "2026-10-05", reaction_exposure_max_abs: 0.0015}
  bias_prior: 1.10                     # risco de carteira otimizada é subestimado (USE4): alvo efetivo 5%/1,10
  bias_prior_weeks: 26
  var_1d_max: 0.010                    # VaR 99% 1d
  es_1d_max: 0.0125
  country_stress_max_loss: 0.015       # perda máx. por cenário de gap de país (% NAV)
  country_gap_scenarios: {BR: [-0.10, 0.10], MX: [-0.13], CL: [-0.15], PE: [-0.10], CO: [-0.11], AR: [-0.56, 0.41]}

liquidity:
  # Com PL de US$ 1,0 mi, o tamanho é limitado pela liquidez RELATIVA (fechamentos para liquidar,
  # capacidade do leilão, participação no ADTV); os pisos absolutos são filtros de qualidade de
  # spread, formação de preço e, nos shorts, de aluguel e risco de recall/squeeze.
  min_adtv_usd: 1000000
  adv_window_days: 63
  participation_rate: 0.20
  max_days_to_liquidate_long: 3.0      # em fechamentos (leilão + janela pré-fechamento)
  max_days_to_liquidate_short: 2.0
  max_trade_days_inception: 5.0
  max_trade_days_weekly: 2.0
  max_weekly_turnover: 0.30           # custo de 60%/sem (~4,7% a.a.) excederia o alpha esperado
  min_adtv_long_usd: 2000000           # long: teto de 4% = US$ 40 mil ≤ 2% do ADTV mínimo
  min_adtv_short_usd: 5000000          # short (mais estrito): 2,5% = US$ 25 mil ≤ 0,5% do ADTV mínimo
  short_participation_rate: 0.15       # shorts: 2 dias a 15% => <= 30% do ADTV
  min_gross_liquid_3d: 0.80
  min_gross_liquid_5d: 0.95

shorting:
  shortable_line_types: [ADR, US_LISTED, LOCAL_BR]
  gc_borrow_fee_us: 0.003
  gc_borrow_fee_br: 0.008
  max_borrow_fee: 0.05                 # vermelho > 5% a.a. para shorts novos
  min_market_cap_short_usd: 500000000

squeeze:
  si_pct_float_medium: 0.10            # ADRs: SI em equivalentes de ações / free float
  si_pct_float_high: 0.20
  days_to_cover_medium: 5.0
  days_to_cover_high: 10.0
  borrow_fee_medium: 0.03
  borrow_fee_high: 0.08
  ret_1m_medium: 0.15
  ret_1m_high: 0.30
  free_float_mcap_low_usd: 1000000000
  # B3: taxa de aluguel é o sinal primário; saldo BTC inclui arbitragem/ETF (docs/research/06)
  br_borrow_fee_medium: 0.05
  br_borrow_fee_high: 0.15
  br_btc_pct_float_medium: 0.15
  br_btc_pct_float_high: 0.25
  br_btc_dtc_medium: 10.0
  br_btc_dtc_high: 20.0
  adr_parity_tolerance: 0.03
  free_float_min_pct: 0.20             # sem short abaixo disso (caso Ambipar)
  controller_max_pct: 0.70
  catalyst_block_sessions: 5           # sem short novo a <= 5 pregões de catalisador
  stop_short_position_loss: 0.25       # stop de squeeze: corte de 50%
  stop_short_nav_loss: 0.01
  score_medium: 40
  score_high: 70
  medium_short_cap_multiplier: 0.5
  enforce_entry_blocks: true           # sem short novo: resultado ≤ 5 pregões; free float < 20%
  stop_scope: name                     # stop por nome: short cortado à metade, sem compra do emissor até revisão

costs:
  commission_bps: {US: 1.0, BR: 3.0, MX: 8.0, CL: 10.0, CO: 15.0, PE: 15.0, AR: 15.0}
  half_spread_bps_by_tier: {T1: 4.0, T2: 8.0, T3: 15.0, T4: 25.0}
  tier_adtv_breaks_usd: [50000000, 15000000, 5000000]
  impact_coefficient: 0.6
  fx_cost_bps: 3.0
  amortization_weeks: 8
  # Custo mínimo por ordem (USD), piso da comissão + tarifas em tabelas públicas; substitui a
  # comissão variável quando maior. Lote padrão + fracionário (B3) ou pico (BMV) contam 2 ordens.
  min_order_cost_usd:
    US: 1.0     # tabela pública de corretora global de acesso direto (plano fixo): US$ 0,005/ação, mínimo US$ 1,00 por ordem, tarifas incluídas
    BR: 0.0     # B3: emolumentos 0,005% + liquidação 0,025% ad valorem, sem mínimo por ordem (no custo em bps)
    MX: 3.5     # BMV: 0,10% com mínimo de MXN 60 por ordem (≈ US$ 3,3 a 18,1 MXN/USD), arredondado para cima
    CL: 28.0    # Santiago: direitos de bolsa com mínimo de 0,5 UF + IVA (≈ US$ 24) e tarifa fixa da corretora (≈ US$ 4)
    CO: 22.0    # BVC: comissão mínima de COP 60 mil + IVA (≈ US$ 22) nas comissionistas de maior porte
    PE: 25.0    # BVL: sem tabela pública padronizada — estimativa conservadora (execução via ADR)
    AR: 25.0    # BYMA: sem tabela pública padronizada — estimativa conservadora (execução via ADR)

alpha:
  signal_weights:
    residual_momentum: 0.25
    short_term_reversal: 0.0    # calibração 2026-10-05: giro sem alpha líquido (reports/backtest/2026-10-05)
    value: 0.20
    quality: 0.15
    low_risk: 0.10
    analyst_revision: 0.15
  information_coefficient: 0.04
  winsor_z: 3.0
  horizon_weeks: 8
  orthogonalize_to_factors: true
  view_information_coefficient: 0.03   # teto (adoção plena S3); efetivo vem de research.llm_phase
  max_view_tilt_z: 1.5
  view_sign_coherence: true          # visão final + ⇒ sem short; − ⇒ sem long (PM prevalece)
  reresidualize_after_views: true    # alpha reortogonalizado após as inclinações das visões

drawdown:                    # escada a partir do pico (Millennium-style, escalada p/ vol 5%)
  soft_stop: -0.025            # revisão de risco + corte de 25% do gross
  soft_degross_multiplier: 0.75
  hard_stop: -0.05             # corte de 50% do gross
  degross_multiplier: 0.5
  stop_out: -0.075             # gross mínimo + revisão completa do processo
  stop_out_gross: 0.5
  risk_reference: normal_book_vol   # escada sobre a vol da mesma carteira no estágio normal (m·σ_ref)

risk_model:
  history_days: 2000                     # todo o histórico disponível (desde 2019); EWMA pondera o recente
  min_obs_days: 126
  halflife_factor_vol: 84
  halflife_factor_corr: 252
  halflife_specific: 84
  newey_west_lags: 3
  specific_shrinkage: 0.3
  min_names_per_sector: 5
  market_proxy: ILF
  macro_factors: [BZ=F, HG=F, GC=F, DX-Y.NYB]   # bloco macro (betas dos resíduos, meia-vida 126)
  linked_groups:                         # holding/controlada: mesma aposta (teto de um nome por lado)
    gerdau: [BR_GOAU, BR_GERDAU]
    itau: [BR_ITAUSA, BR_ITAU]
    csn: [BR_CSN, BR_CMIN]
    vale: [BR_BRADESPAR, BR_VALE]

research:
  provider: imported                     # pesquisa e decisão escritas pela mente (Claude Code / Codex)
  top_n_candidates: 40
  news_lookback_days: 14
  llm_can_only_tighten: true
  # Adoção gradual das visões de IA no alpha (shadow → produção). IC efetivo por fase;
  # promoção exige IC realizado (S2: ICIR≥0,5 em ≥13 semanas; S3: t≥2 em ≥52 semanas) e
  # rebaixamento automático se IC 13s < 0 com t ≤ -1,5 ou incidente de alucinação/look-ahead.
  # Início em S1 (IC 0,01): a pesquisa influencia marginalmente desde a inception, com
  # vetos de risco (no_short/no_long) sempre ativos.
  llm_phase: S1
  llm_view_ic_by_phase: {S0: 0.0, S1: 0.01, S2: 0.02, S3: 0.03}
  samples_per_judgment: 5
  min_sign_agreement: 0.8

execution:
  rebalance_calendar: XNYS
  decision_deadline_cap_local: "15:00"   # Brasília
  decision_buffer_minutes: 45            # prazo efetivo = min(15:00, fechamento mais cedo NYSE/B3/BMV − 45 min)
  close_times:                           # horários oficiais (fuso de cada mercado); fechamentos antecipados vêm do calendário
    XNYS: {tz: America/New_York, close: "16:00", moc_cutoff: "15:50"}   # NYSE: MOC/LOC até 15:50 ET
    XNAS: {tz: America/New_York, close: "16:00", moc_cutoff: "15:55"}   # Nasdaq Closing Cross: MOC até 15:55 ET
    ARCX: {tz: America/New_York, close: "16:00", moc_cutoff: "15:59"}   # NYSE Arca: congelamento 15:59–16:00 ET
    BVMF: {tz: America/New_York, close: "16:00", moc_cutoff: "15:55"}   # B3 alinhada a Nova York: call 16:55–17:00 BRT (17:55–18:00 a partir de 02/11)
    XMEX: {tz: America/New_York, close: "16:00", moc_cutoff: "15:40"}   # BMV: ordens ao fechamento até 13:40 (CDMX, horário de verão nos EUA); PPP 13:40–14:00
    XSGO: {tz: America/Santiago, close: "16:00", moc_cutoff: "15:45"}   # Bolsa de Santiago: pregão 09:30–16:00; sessão de fechamento de 15 min (inferência conservadora)
    XBOG: {tz: America/New_York, close: "16:00", moc_cutoff: "15:55"}   # BVC alinhada a Nova York: leilão de fechamento 14:55–15:00 Bogotá (verão nos EUA)
    XLIM: {tz: America/New_York, close: "16:00", moc_cutoff: "15:52"}   # BVL alinhada a Nova York: leilão de fechamento 14:52–15:00 Lima (verão nos EUA)
    XBUE: {tz: America/Argentina/Buenos_Aires, close: "17:00", moc_cutoff: "16:57"}   # BYMA: leilão de fechamento 16:57–17:00
  capacity:
    adv_statistic: p25
    adv_window_days: 20
    auction_participation: 0.10          # teto absoluto 0,15
    preclose_participation: 0.10
    preclose_volume_share: 0.25
    auction_share: {US_STOCK: 0.10, ADR: 0.06, ETF_US: 0.01, BR: 0.08, MX: 0.10, CL: 0.10, CO: 0.05, PE: 0.05, AR: 0.05}
    short_multiplier: 0.75
    early_close_multiplier: 0.5
  min_trade_weight: 0.001                # banda de não-negociação: 0,10% do NAV (US$ 1 mil; a metade da posição mínima)
  max_fixed_cost_bps: 10                 # ordem só sai se o custo fixo mínimo ≤ 10 bps do nocional (banda por mercado)
  local_closed_policy: adr_if_eligible_else_freeze
  early_close_mode: capacity_half
  max_closes: 1                          # um leilão por dia de montagem
  fill_volume_source: realized_daily
  close_impact_discount: {US_STOCK: 0.6, ADR: 0.6, BR: 0.6, MX: 0.6, CL: 0.6, ETF_US: 1.0, CO: 1.0, PE: 1.0, AR: 1.0}
  closed_home_market_spread_mult: 1.5
