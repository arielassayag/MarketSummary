name: cdp-ci — diagnóstico custo892

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    name: Diagnóstico Ubuntu do custo natural (item892)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CDP_HARNESS: codex
      TZ: America/Sao_Paulo
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Conferir fonte5cb preservada
        shell: bash
        run: |
          mkdir -p .cdp/validacoes/ci-diagnostico-892
          git rev-parse HEAD > .cdp/validacoes/ci-diagnostico-892/head.txt
          git diff --exit-code 5cb2d4ab8c250b3289dc90fb4e655637335a0aec -- src tests configs pyproject.toml uv.lock
          sha256sum tests/cdp/test_contrato_custos_integridade.py tests/cdp/fixtures/custo_minimo_reserva.json uv.lock > .cdp/validacoes/ci-diagnostico-892/fonte-sha256.txt
      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
          python-version: "3.12"
      - name: Dependências congeladas
        shell: bash
        run: |
          set -o pipefail
          uv sync --frozen --extra dev --extra ai 2>&1 | tee .cdp/validacoes/ci-diagnostico-892/dependencias.log
          uv pip freeze > .cdp/validacoes/ci-diagnostico-892/dependencias.txt
      - name: Ambiente e solvers observados
        shell: bash
        run: |
          uv run --frozen python - <<'PY' > .cdp/validacoes/ci-diagnostico-892/ambiente.json
          import cvxpy, importlib.metadata, json, os, platform, sys
          print(json.dumps({
              "python": sys.version,
              "platform": platform.platform(),
              "machine": platform.machine(),
              "versions": {p: importlib.metadata.version(p) for p in
                           ["pytest", "numpy", "cvxpy", "scs", "clarabel", "pandas", "pydantic"]},
              "installed_solvers": cvxpy.installed_solvers(),
              "environment": {k: os.environ.get(k) for k in
                              ["CDP_HARNESS", "TZ", "PYTHONUTF8", "OMP_NUM_THREADS", "OPENBLAS_NUM_THREADS", "MKL_NUM_THREADS"]},
              "data_notice": "DADOS SIMULADOS: episódio natural de teste; não é operação/publicação"
          }, ensure_ascii=False, indent=2))
          PY
      - name: Único teste natural original
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen python -B -m pytest tests/cdp/test_contrato_custos_integridade.py::test_natural_booking_payload_matches_independent_floor_and_readers_do_not_write -o addopts='' -vv -x -p no:cacheprovider --basetemp=.cdp/validacoes/ci-diagnostico-892/pytest --junitxml=.cdp/validacoes/ci-diagnostico-892/junit.xml --durations=20 2>&1 | tee .cdp/validacoes/ci-diagnostico-892/pytest.log
      - name: Preservar ordens e comissão observadas
        if: ${{ always() }}
        shell: bash
        run: |
          uv run --frozen python - <<'PY' > .cdp/validacoes/ci-diagnostico-892/episodio.log 2>&1
          from pathlib import Path
          from decimal import Decimal
          import hashlib, json, xml.etree.ElementTree as ET
          root = Path(".cdp/validacoes/ci-diagnostico-892")
          fixture_path = Path("tests/cdp/fixtures/custo_minimo_reserva.json")
          fixture = json.loads(fixture_path.read_text())
          episodes = []
          for source in sorted((root / "pytest").rglob("book/track_record*/risco_diario/2026-11-13.json")):
              raw = source.read_bytes()
              document = json.loads(raw)
              cost = document.get("execution_costs")
              if not isinstance(cost, dict):
                  episodes.append({"path": str(source), "execution_costs": None,
                                   "reason": "diagnóstico autenticado de custos ausente"})
                  continue
              frame = cost.get("frame", {})
              results = cost.get("result", {})
              per_line = []
              for ticker in sorted(set(frame) | set(results)):
                  row, result = frame.get(ticker), results.get(ticker)
                  got = None
                  if isinstance(row, dict) and isinstance(result, dict):
                      nocional, commission = row.get("notional_usd"), result.get("commission_bps")
                      if nocional is not None and commission is not None:
                          got = str(Decimal(str(commission)) * Decimal(str(nocional)) / Decimal(10000))
                  per_line.append({"ticker": ticker, "frame": row, "result": result,
                                   "commission_usd_from_recorded_bps_decimal": got})
              episodes.append({"path": str(source), "sha256": hashlib.sha256(raw).hexdigest(),
                               "execution_costs": cost, "per_line": per_line})
          junit_path = root / "junit.xml"
          suites = []
          if junit_path.is_file():
              tree = ET.parse(junit_path).getroot()
              suites = [n.attrib for n in tree.iter("testsuite")]
          financial_confirmed = (bool(episodes) and len(suites) == 1
                                 and int(suites[0].get("tests", "0")) == 1
                                 and all(int(suites[0].get(k, "0")) == 0 for k in ["errors", "failures", "skipped"]))
          report = {"schema": "cdp.ci.diagnostico_custo892/v1", "data_notice": "DADOS SIMULADOS",
                    "episodes_found": len(episodes), "episodes": episodes,
                    "junit_suites": suites, "financial_confirmed": financial_confirmed,
                    "original_fixture": fixture,
                    "original_fixture_sha256": hashlib.sha256(fixture_path.read_bytes()).hexdigest(),
                    "junit_exists": (root / "junit.xml").is_file(),
                    "limit": "Leitura das provas produzidas pelo teste original; não altera alvo, ordens, configuração, custo ou fixture. Ausência permanece null."}
          (root / "episodio.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps({"episodes_found": len(episodes), "junit_exists": report["junit_exists"], "financial_confirmed": financial_confirmed}))
          if not report["junit_exists"] or not episodes:
              raise SystemExit("prova focal ausente/incompleta; sem confirmação financeira")
          PY
      - name: Guardar diagnóstico, logs e episódio privado
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostico-custo892-${{ github.run_id }}
          path: .cdp/validacoes/ci-diagnostico-892
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
