<title>Painel CDP</title>
<style>
  :root {
    --bg: #f7f7f5; --fg: #1f2328; --muted: #5b636b; --card: #ffffff; --line: #d9dcdf;
    --warn-bg: #fff4d6; --warn-fg: #6b4a00; --err-bg: #fde7e7; --err-fg: #8a1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181b; --fg: #e6e8ea; --muted: #9aa3ab; --card: #1d2125; --line: #30363c;
      --warn-bg: #3a2f10; --warn-fg: #f5d488; --err-bg: #3d1717; --err-fg: #f3b0b0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181b; --fg: #e6e8ea; --muted: #9aa3ab; --card: #1d2125; --line: #30363c;
    --warn-bg: #3a2f10; --warn-fg: #f5d488; --err-bg: #3d1717; --err-fg: #f3b0b0;
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
          padding: 16px; margin: 12px 0; }
  .banner { padding: 10px 14px; border-radius: 8px; font-weight: 600; margin: 12px 0;
            background: var(--warn-bg); color: var(--warn-fg); }
  .muted { color: var(--muted); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
</style>
<main>
  <h1 id="fund">Painel CDP</h1>
  <div id="notice" class="banner" hidden></div>
  <section class="card">
    <p class="muted">Modelo provisório do painel: os dados abaixo vêm do exportador
      (<code>cdp.workflow.painel</code>); a página completa substitui este modelo.</p>
    <dl id="summary"></dl>
  </section>
</main>
<script type="application/json" id="cdp-data">__CDP_DATA__</script>
<script>
  (function () {
    var el = document.getElementById("cdp-data");
    var data;
    try { data = JSON.parse(el.textContent); } catch (e) { return; }
    var meta = data.meta || {}, status = data.status || {};
    document.getElementById("fund").textContent = meta.fund_name || "Painel CDP";
    var notice = document.getElementById("notice");
    if (meta.is_synthetic) {
      notice.hidden = false;
      notice.textContent = meta.data_notice || "DADOS SIMULADOS";
    }
    var rows = [
      ["Gerado em", meta.generated_at_local],
      ["Fase", status.phase_label],
      ["Último registro", status.last_record_date],
      ["Semana vigente", status.live_book_week || status.latest_decision_week],
      ["Integridade", status.integrity ? (status.integrity.ok ? "íntegro" : "FALHA") : null],
      ["Natureza", meta.paper_trading_label],
      ["Hash dos dados", meta.data_hash]
    ];
    var dl = document.getElementById("summary");
    rows.forEach(function (r) {
      var dt = document.createElement("dt"); dt.textContent = r[0];
      var dd = document.createElement("dd");
      dd.textContent = (r[1] === null || r[1] === undefined || r[1] === "") ? "n/d" : String(r[1]);
      dl.appendChild(dt); dl.appendChild(dd);
    });
  })();
</script>
