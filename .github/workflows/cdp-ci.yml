# .github/workflows/cdp-ci.yml — integração contínua do repositório (sem segredos, só leitura).
#
# qualidade: lint e a suíte de testes (offline, determinística).
# operacao:  integridade do livro, agenda das rotinas, skills neutras em dia e o portal montado
#            com a demonstração (DADOS SIMULADOS), disponível como artefato do workflow para
#            revisão de mudanças visuais.
name: cdp-ci

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "configs/**"
      - "scripts/**"
      - "plugins/**"
      - ".claude/**"
      - ".agents/**"
      - ".gemini/**"
      - "docs/**"
      - "site/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e testes
    runs-on: ubuntu-24.04
    # A CI5cb excedeu 90 minutos antes de concluir; manter todos os casos.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Dependências
        run: uv sync --frozen --extra dev --extra ai --extra mcp
      - name: Lint
        run: uv run ruff check .
      - name: Testes
        env:
          CDP_HARNESS: codex
          TZ: America/Sao_Paulo
          PYTHONUTF8: "1"
        # Só a suíte do CDP: o app "fechamento" (raiz do repositório) é outro projeto, com CI própria.
        # A primeira falha encerra com traceback/JUnit; sucesso exige a suíte inteira.
        run: uv run pytest tests/cdp -q -x -p no:cacheprovider --junitxml=.cdp/validacoes/ci-junit.xml --durations=20
      - name: Guardar relatório dos testes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testes-cdp
          path: .cdp/validacoes/ci-junit.xml
          retention-days: 7
          if-no-files-found: warn

  pacote:
    name: Wheel instalado e MCP STDIO
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Preparar cache e temporários privados
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cdp-pacote-cache" "$RUNNER_TEMP/cdp-pacote-tmp"
          printf '%s\n' \
            "UV_CACHE_DIR=$RUNNER_TEMP/cdp-pacote-cache" \
            "TMPDIR=$RUNNER_TEMP/cdp-pacote-tmp" \
            "TEMP=$RUNNER_TEMP/cdp-pacote-tmp" \
            "TMP=$RUNNER_TEMP/cdp-pacote-tmp" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Ambiente próprio e backend explícito
        run: |
          uv --no-config sync --frozen --extra mcp --extra dev
          uv --no-config pip install --python .venv/bin/python --only-binary :all: --index-url https://pypi.org/simple setuptools==84.0.0
      - name: Build e instalação sem editable
        run: |
          uv --no-config build --no-build-isolation --out-dir .cdp/qualificacoes/pacote/dist
          uv --no-config export --frozen --no-dev --extra mcp --no-emit-project --format requirements.txt --output-file .cdp/qualificacoes/pacote/dependencias.txt
          uv --no-config venv "$RUNNER_TEMP/cdp-pacote-env"
          uv --no-config pip sync --python "$RUNNER_TEMP/cdp-pacote-env/bin/python" --require-hashes --only-binary :all: --index-url https://pypi.org/simple .cdp/qualificacoes/pacote/dependencias.txt
          uv --no-config pip install --python "$RUNNER_TEMP/cdp-pacote-env/bin/python" --no-deps .cdp/qualificacoes/pacote/dist/*.whl
      - name: Recursos, kernels e nove consultas nativas instaladas
        run: |
          "$RUNNER_TEMP/cdp-pacote-env/bin/python" -I "$GITHUB_WORKSPACE/scripts/cdp_qualificar_pacote.py" --fonte "$GITHUB_WORKSPACE" --saida "$RUNNER_TEMP/cdp-pacote-prova"
      - name: Guardar qualificação instalada
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacote-cdp-instalado
          path: |
            ${{ runner.temp }}/cdp-pacote-prova
            .cdp/qualificacoes/pacote
          retention-days: 7
          if-no-files-found: warn

  operacao:
    name: Livro, rotinas, skills e portal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Dependências (sem extras)
        run: uv sync --frozen --no-dev
      - name: Integridade do livro
        run: uv run --frozen --no-dev python -m cdp verify
      - name: Agenda das rotinas
        run: uv run --frozen --no-dev python -m cdp rotinas verificar
      - name: Skills neutras em dia
        run: uv run --frozen --no-dev python -m cdp skills verificar
      - name: Portal da demonstração (DADOS SIMULADOS)
        env:
          TZ: America/Sao_Paulo
          PYTHONUTF8: "1"
        run: |
          uv run --frozen --no-dev python -m cdp site construir --demo --saida _site_demo \
            --base-url https://example.invalid/cdp
          uv run --frozen --no-dev python -m cdp site conferir --saida _site_demo
      - name: Guardar a prévia do portal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-demo
          path: _site_demo
          retention-days: 7
