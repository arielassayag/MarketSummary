# Calendário macro público que movimenta os modelos da cobertura (CDP — Cabra da Peste).
#
# Regra (código: cdp.workflow.agenda.coverage_status; roteiro: docs/cdp/playbooks/DIARIO.md):
# - impacto "alto" (decisões de juros e inflação que entram nos insumos dos modelos: meta Selic e
#   IPCA em 12 meses do BCB, Treasury de 10 anos do FRED) ⇒ nova execução COMPLETA da cobertura no
#   fechamento do primeiro pregão (B3, NYSE ou BMV) que reagiu ao evento — o próprio dia, se o
#   evento sai num pregão antes das 16:00 de Nova York; senão o pregão seguinte —, pela rotina
#   diária daquela noite. Na véspera de um dia de montagem, a atualização completa da manhã
#   seguinte (antes da decisão) cobre o evento: o motor grava um retrato por data;
# - impacto "medio" ⇒ só listado na agenda (`cobertura.macro.proximos_7_dias`); o retrato do dia
#   de montagem absorve o efeito de mercado.
#
# Só fontes públicas: a página oficial do banco central ou do instituto de estatística. Datas
# conferidas em 06/10/2026. Calendário que a fonte ainda não publicou fica AUSENTE (nunca
# estimado) e entra por commit quando for publicado (`publicado_ate` e `lacunas`). Mudou este
# arquivo ⇒ commit revisável numa sessão de desenvolvimento (as rotinas nunca o editam).
versao: 1
conferido_em: "2026-10-06"
publicado_ate:            # último mês com datas oficiais conferidas, por série
  copom: "2027-12"
  fomc: "2027-12"         # 2027: calendário provisório do Fed (confirmado reunião a reunião)
  ipca: "2026-12"
  cpi_eua: "2026-12"
  banxico: "2026-12"
  inegi_inpc: "2027-06"
  inegi_inpc_quinzena: "2027-06"
  bcch: "2027-12"
  banrep: "2026-12"
lacunas:
  - "IPCA (IBGE): calendário de 2027 ainda não publicado pelo IBGE"
  - "CPI dos EUA (BLS): calendário de 2027 ainda não publicado pelo BLS"
  - "Banxico: calendário de 2027 ainda não publicado pelo Banco de México"
  - "INPC (INEGI): calendário do segundo semestre de 2027 ainda não publicado"
  - "BanRep (Colômbia): calendário de 2027 ainda não publicado"
  - "BCRP (Peru): calendário oficial do programa monetário de outubro a dezembro de 2026 não localizado em fonte pública na conferência"
